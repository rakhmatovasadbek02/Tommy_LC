<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Profile — Tommy LC Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="student-shared.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
.sp-setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.sp-setting-row:last-child { border-bottom: none; }
.sp-setting-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.sp-setting-sub { font-size: 12px; color: var(--text-secondary); }
.sp-setting-row:hover { background: var(--accent-light); margin: 0 -20px; padding-left: 20px; padding-right: 20px; border-radius: 8px; }
</style>
</head>
<body>
<div id="spHeader"></div>
<div class="sp-main">
  <div id="content" class="sp-loading">Loading your profile…</div>
</div>
<div id="spTabbar" class="sp-tabbar"></div>
<script src="student-shared.js"></script>
<script>
spRequireAuth();
spRenderHeader('profile');
let ME = null;

function scheduleLabel(g) {
  const days = g.schedType === 'odd' ? 'Mon / Wed / Fri' : g.schedType === 'even' ? 'Tue / Thu / Sat' : spEscapeHtml(g.schedType || '—');
  return `${days}${g.time ? ' · ' + spEscapeHtml(g.time) : ''}`;
}

async function load() {
  const el = document.getElementById('content');
  try {
    ME = await spGet('/api/student/me');
    render();
  } catch (e) {
    el.innerHTML = `<div class="sp-banner red">${spEscapeHtml(e.message)}</div>`;
  }
}

function render() {
  const me = ME;
  const g = me.groups[0];
  const el = document.getElementById('content');

  el.innerHTML = `
    <div class="sp-cols">
      <div class="sp-card">
        <div class="sp-card-title">Personal Details</div>
        <div class="sp-detail-row"><span class="sp-detail-label">Phone</span><span class="sp-detail-value">${spEscapeHtml(me.phone||'—')}</span></div>
        ${me.school ? `<div class="sp-detail-row"><span class="sp-detail-label">School</span><span class="sp-detail-value">${spEscapeHtml(me.school)}</span></div>` : ''}
        ${me.grade ? `<div class="sp-detail-row"><span class="sp-detail-label">Grade</span><span class="sp-detail-value">${spEscapeHtml(me.grade)}</span></div>` : ''}
        ${me.address ? `<div class="sp-detail-row"><span class="sp-detail-label">Address</span><span class="sp-detail-value">${spEscapeHtml(me.address)}</span></div>` : ''}
      </div>

      <div class="sp-card">
        <div class="sp-card-title">Group &amp; Schedule</div>
        ${g ? `
          <div class="sp-detail-row"><span class="sp-detail-label">Group</span><span class="sp-detail-value">${spEscapeHtml(g.name)}</span></div>
          ${g.teacher ? `<div class="sp-detail-row"><span class="sp-detail-label">Teacher</span><span class="sp-detail-value">${spEscapeHtml(g.teacher)}</span></div>` : ''}
          <div class="sp-detail-row"><span class="sp-detail-label">Room</span><span class="sp-detail-value">${spEscapeHtml(g.room||'—')}</span></div>
          <div class="sp-detail-row"><span class="sp-detail-label">Schedule</span><span class="sp-detail-value">${scheduleLabel(g)}</span></div>
        ` : `<div class="sp-empty">Not enrolled in a group yet.</div>`}
      </div>
    </div>

    <div class="sp-card" id="settingsCard">
      <div class="sp-card-title">Account Settings</div>
      <div id="settingsBody">${settingsListHtml()}</div>
    </div>

    <button class="sp-btn sp-btn-outline sp-btn-block" onclick="spLogout()"><i class="fas fa-arrow-right-from-bracket"></i>&nbsp; Sign Out</button>
  `;
}

function settingsListHtml() {
  return `
    <div class="sp-setting-row" onclick="showPasswordForm()">
      <div>
        <div class="sp-setting-title">Change Password</div>
        <div class="sp-setting-sub">Update your login credentials</div>
      </div>
      <i class="fas fa-chevron-right" style="color:var(--text-tertiary);font-size:12px"></i>
    </div>
  `;
}

function showPasswordForm() {
  document.getElementById('settingsBody').innerHTML = `
    <div class="sp-banner red" id="pwErr" style="display:none"></div>
    <div class="sp-form-group">
      <label>Current Password</label>
      <input type="password" class="sp-input" id="pwCurrent" autocomplete="current-password">
    </div>
    <div class="sp-form-group">
      <label>New Password</label>
      <input type="password" class="sp-input" id="pwNew" placeholder="At least 4 characters" autocomplete="new-password">
    </div>
    <div style="display:flex;gap:10px">
      <button class="sp-btn sp-btn-outline" onclick="cancelPasswordForm()">Cancel</button>
      <button class="sp-btn sp-btn-primary" id="pwSaveBtn" onclick="savePassword()">Save</button>
    </div>
  `;
}
function cancelPasswordForm() {
  document.getElementById('settingsBody').innerHTML = settingsListHtml();
}
async function savePassword() {
  const err = document.getElementById('pwErr');
  err.style.display = 'none';
  const currentPassword = document.getElementById('pwCurrent').value;
  const newPassword = document.getElementById('pwNew').value;
  if (!currentPassword || !newPassword) { err.textContent = 'Fill in both fields.'; err.style.display = 'block'; return; }
  const btn = document.getElementById('pwSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await spPost('/api/student/account/change-password', { currentPassword, newPassword });
    spToast('Password updated.');
    cancelPasswordForm();
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Save';
  }
}

load();
</script>
</body>
</html>
