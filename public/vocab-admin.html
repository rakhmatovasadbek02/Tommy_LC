<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Test — TommyLC CRM</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#990000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TommyLC">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    .vtabs{display:flex;gap:8px;margin-bottom:18px}
    .vtab{padding:9px 16px;border-radius:9px;border:1.5px solid var(--border);background:white;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
    .vtab.on{border-color:var(--crimson);background:var(--crimson-soft);color:var(--crimson-dark)}
    .vcard{background:white;border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .vcard-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
    .vcard-title{font-size:15px;font-weight:700;color:var(--text)}
    .vcard-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .vpill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
    .vpill.pair{background:var(--crimson-soft);color:var(--crimson-dark);border-color:transparent}
    .vrow-actions{display:flex;gap:8px}
    .vword-list{max-height:160px;overflow:auto;font-size:12.5px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--border);padding-top:10px}
    .vword-list div{padding:2px 0}
    .vcode-box{font-family:ui-monospace,monospace;font-size:26px;font-weight:800;letter-spacing:4px;color:var(--crimson-dark);background:var(--crimson-soft);border-radius:10px;padding:12px 18px;text-align:center;margin:12px 0}
    .vtable{width:100%;border-collapse:collapse;font-size:13px}
    .vtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
    .vtable td{padding:9px 10px;border-bottom:1px solid var(--border)}
    .vbadge-used{color:var(--muted)}
    .vbadge-pending{color:#b8860b;font-weight:700}
    .student-pick{position:relative}
    .student-pick-list{position:absolute;top:100%;left:0;right:0;background:white;border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:220px;overflow:auto;z-index:20;display:none}
    .student-pick-list.open{display:block}
    .student-pick-item{padding:9px 13px;cursor:pointer;font-size:13.5px}
    .student-pick-item:hover{background:var(--surface)}
    .word-pair-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
    .word-pair-row input{margin:0}
    .word-col-labels{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:4px}
    .word-col-labels span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .unit-pick-list{border:1.5px solid var(--border);border-radius:10px;max-height:260px;overflow:auto}
    .unit-pick-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer}
    .unit-pick-item:last-child{border-bottom:none}
    .unit-pick-item:hover{background:var(--surface)}
    .unit-pick-item input{width:16px;height:16px;accent-color:var(--crimson);flex-shrink:0}
    .unit-pick-name{font-size:13.5px;font-weight:600;color:var(--text)}
    .unit-pick-sub{font-size:11.5px;color:var(--muted)}
    .unit-pick-edit{margin-left:auto;display:flex;gap:4px}
    .unit-pick-icon{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px}
    .unit-pick-icon:hover{background:var(--border);color:var(--text)}
  </style>
</head>
<body>
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar">
    <div class="page-title">Vocabulary Test</div>
  </div>
  <div class="page-content">
    <div class="vtabs">
      <button class="vtab on" id="tabGrant" onclick="switchTab('grant')">Grant Access</button>
      <button class="vtab" id="tabHistory" onclick="switchTab('history')">History</button>
    </div>

    <div id="panelGrant">
      <div class="vcard">
        <div class="vcard-title" style="margin-bottom:12px">Grant a student a one-time test code</div>
        <div class="form-group student-pick">
          <label>Student</label>
          <input type="text" id="grantStudentQuery" placeholder="Type a student name…" autocomplete="off" oninput="filterStudentPick()" onfocus="filterStudentPick()">
          <div class="student-pick-list" id="studentPickList"></div>
          <input type="hidden" id="grantStudentId">
        </div>
        <div class="form-group">
          <label>Units / Themes <span style="font-weight:400;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0">(pick one or more — the test mixes all their words together)</span></label>
          <div class="unit-pick-list" id="unitPickList"></div>
        </div>
        <button class="btn btn-primary" onclick="grantAccess()">Generate Code</button>
        <div id="grantResult"></div>
      </div>
      <div class="vcard">
        <div class="vcard-title" style="margin-bottom:10px">Access codes</div>
        <table class="vtable" id="pendingTable"><thead><tr><th>Student</th><th>Units</th><th>Code</th><th>Status</th><th>Granted by</th><th></th></tr></thead><tbody></tbody></table>
      </div>
    </div>

    <div id="panelHistory" style="display:none">
      <table class="vtable" id="historyTable"><thead><tr><th>Student</th><th>Units</th><th>Score</th><th>Completed</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="unitModal">
  <div class="modal" style="width:820px">
    <div class="modal-header">
      <div class="modal-title" id="unitModalTitle">New Unit</div>
      <button class="modal-close" onclick="closeModal('unitModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="uId">
      <div class="form-row">
        <div class="form-group"><label>Unit / Theme name *</label><input type="text" id="uName" placeholder="Unit 4 — Food"></div>
      </div>
      <div class="form-group">
        <label>Words * <span style="font-weight:400;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0">(English / Russian / Uzbek)</span></label>
        <div class="word-col-labels"><span>English</span><span>Russian</span><span>Uzbek</span><span></span></div>
        <div id="wordRows"></div>
        <button class="btn btn-outline" type="button" onclick="addWordRow()" style="margin-top:4px">+ Add word</button>
        <div style="font-size:12px;color:var(--muted);margin-top:8px">Alternate accepted answers can be separated with "/" (e.g. <code>hi/hello</code>).</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('unitModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveUnit()">Save</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="shared.js"></script>
<script>
requireAuth('vocab');
renderSidebar('vocab');

let UNITS = [], STUDENTS = [], ACCESS = [], ATTEMPTS = [];
let SELECTED_UNIT_IDS = new Set();
const canManage = can('vocab');

async function loadAll() {
  [UNITS, STUDENTS, ACCESS, ATTEMPTS] = await Promise.all([
    apiGet('/api/vocab/units'),
    apiGet('/api/students'),
    apiGet('/api/vocab/access'),
    apiGet('/api/vocab/attempts'),
  ]);
  renderUnitPickList();
  renderPending();
  renderHistory();
  applyStudentFromQuery();
}

// Arriving from a student's profile (vocab-admin.html?studentId=...): jump straight
// to Grant Access with that student pre-selected.
function applyStudentFromQuery() {
  const studentId = new URLSearchParams(location.search).get('studentId');
  if (!studentId) return;
  const s = STUDENTS.find(x => x.id === studentId);
  if (!s) { showToast('Student not found.', 'error'); return; }
  switchTab('grant');
  pickStudent(s.id, `${s.lastName} ${s.firstName}`);
}

function switchTab(t) {
  ['grant','history'].forEach(x => {
    document.getElementById('panel'+x[0].toUpperCase()+x.slice(1)).style.display = x===t ? '' : 'none';
    document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on', x===t);
  });
}

function toggleUnit(id, checked) {
  if (checked) SELECTED_UNIT_IDS.add(id); else SELECTED_UNIT_IDS.delete(id);
}

function renderUnitPickList() {
  const el = document.getElementById('unitPickList');
  if (!UNITS.length) { el.innerHTML = '<div style="padding:14px;text-align:center;color:var(--muted);font-size:13px">No units yet — create one below.</div>'; return; }
  el.innerHTML = UNITS.map(u => `
    <label class="unit-pick-item">
      <input type="checkbox" ${SELECTED_UNIT_IDS.has(u.id)?'checked':''} onchange="toggleUnit('${u.id}', this.checked)">
      <div>
        <div class="unit-pick-name">${escapeHtml(u.name)}</div>
        <div class="unit-pick-sub">${u.wordCount} word${u.wordCount===1?'':'s'}</div>
      </div>
      ${canManage ? `<div class="unit-pick-edit">
        <button type="button" class="unit-pick-icon" title="Edit" onclick="event.preventDefault();editUnit('${u.id}')">${IC.edit}</button>
        <button type="button" class="unit-pick-icon" title="Delete" onclick="event.preventDefault();deleteUnit('${u.id}')">${IC.trash}</button>
      </div>` : ''}
    </label>
  `).join('');
}

function filterStudentPick() {
  const q = document.getElementById('grantStudentQuery').value.trim().toLowerCase();
  const list = document.getElementById('studentPickList');
  if (!q) { list.classList.remove('open'); list.innerHTML = ''; return; }
  const matches = STUDENTS.filter(s => (s.lastName+' '+s.firstName).toLowerCase().includes(q)).slice(0, 15);
  list.innerHTML = matches.map(s => `<div class="student-pick-item" onclick="pickStudent('${s.id}','${escapeHtml(s.lastName+' '+s.firstName).replace(/'/g,"\\'")}')">${escapeHtml(s.lastName)} ${escapeHtml(s.firstName)}</div>`).join('') || '<div class="student-pick-item" style="color:var(--muted)">No matches</div>';
  list.classList.add('open');
}
function pickStudent(id, name) {
  document.getElementById('grantStudentId').value = id;
  document.getElementById('grantStudentQuery').value = name;
  document.getElementById('studentPickList').classList.remove('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.student-pick')) document.getElementById('studentPickList').classList.remove('open');
});

async function grantAccess() {
  const studentId = document.getElementById('grantStudentId').value;
  const unitIds = [...SELECTED_UNIT_IDS];
  if (!studentId) return showToast('Pick a student first.', 'error');
  if (!unitIds.length) return showToast('Pick at least one unit.', 'error');
  try {
    const r = await apiPost('/api/vocab/access', { studentId, unitIds });
    document.getElementById('grantResult').innerHTML = `<div class="vcode-box">${r.code}</div><div style="text-align:center;color:var(--muted);font-size:12px">Give this code to the student on vocab-test.html. Single use.</div>`;
    document.getElementById('grantStudentQuery').value = '';
    document.getElementById('grantStudentId').value = '';
    SELECTED_UNIT_IDS = new Set();
    await loadAll();
  } catch(e) { showToast(e.message, 'error'); }
}

function renderPending() {
  const tbody = document.querySelector('#pendingTable tbody');
  tbody.innerHTML = ACCESS.map(a => `
    <tr>
      <td>${escapeHtml(a.studentName)}</td>
      <td>${escapeHtml(a.unitNames.join(', '))}</td>
      <td style="font-family:ui-monospace,monospace;font-weight:700">${a.code}</td>
      <td>${a.used ? '<span class="vbadge-used">Used</span>' : '<span class="vbadge-pending">Pending</span>'}</td>
      <td>${escapeHtml(a.grantedBy||'')}</td>
      <td>${canManage && !a.used ? `<button class="btn btn-outline" onclick="revokeAccess('${a.id}')">Revoke</button>` : ''}</td>
    </tr>
  `).join('') || '<tr><td colspan="6" style="color:var(--muted);text-align:center">No codes granted yet.</td></tr>';
}

async function revokeAccess(id) {
  try { await apiDelete('/api/vocab/access/'+id); await loadAll(); } catch(e) { showToast(e.message, 'error'); }
}

function renderHistory() {
  const tbody = document.querySelector('#historyTable tbody');
  tbody.innerHTML = ATTEMPTS.map(t => `
    <tr>
      <td>${escapeHtml(t.studentName)}</td>
      <td>${escapeHtml(t.unitNames.join(', '))}</td>
      <td>${t.score} / ${t.total}</td>
      <td>${new Date(t.completedAt).toLocaleString('en-GB', { timeZone:'Asia/Tashkent', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false })}</td>
    </tr>
  `).join('') || '<tr><td colspan="4" style="color:var(--muted);text-align:center">No completed tests yet.</td></tr>';
}

/* ---- Unit create/edit modal ---- */
function joinAlt(main, alts) { return (main||'') + (alts && alts.length ? ('/'+alts.join('/')) : ''); }
function addWordRow(en, enAlt, ru, ruAlt, uz, uzAlt) {
  const wrap = document.getElementById('wordRows');
  const row = document.createElement('div');
  row.className = 'word-pair-row';
  row.innerHTML = `
    <input type="text" class="w-en" placeholder="English (+ /alt)" value="${escapeAttr(joinAlt(en, enAlt))}">
    <input type="text" class="w-ru" placeholder="Russian (+ /alt)" value="${escapeAttr(joinAlt(ru, ruAlt))}">
    <input type="text" class="w-uz" placeholder="Uzbek (+ /alt)" value="${escapeAttr(joinAlt(uz, uzAlt))}">
    <button class="btn btn-outline" type="button" onclick="this.parentElement.remove()">✕</button>
  `;
  wrap.appendChild(row);
}
function editUnit(id) {
  const u = UNITS.find(x => x.id === id);
  if (!u) return;
  document.getElementById('unitModalTitle').textContent = 'Edit Unit';
  document.getElementById('uId').value = u.id;
  document.getElementById('uName').value = u.name;
  document.getElementById('wordRows').innerHTML = '';
  u.words.forEach(w => addWordRow(w.en, w.enAlt, w.ru, w.ruAlt, w.uz, w.uzAlt));
  openModal('unitModal');
}
async function deleteUnit(id) {
  if (!confirm('Delete this unit? Pending (unused) access codes that only cover this unit will be removed; codes covering other units too will just lose this one.')) return;
  try {
    await apiDelete('/api/vocab/units/'+id);
    SELECTED_UNIT_IDS.delete(id);
    await loadAll();
  } catch(e) { showToast(e.message, 'error'); }
}
function parseWordCell(v) {
  const parts = String(v||'').split('/').map(s => s.trim()).filter(Boolean);
  return { main: parts[0]||'', alts: parts.slice(1) };
}
async function saveUnit() {
  const id = document.getElementById('uId').value;
  const name = document.getElementById('uName').value.trim();
  const words = [...document.querySelectorAll('#wordRows .word-pair-row')].map(row => {
    const en = parseWordCell(row.querySelector('.w-en').value);
    const ru = parseWordCell(row.querySelector('.w-ru').value);
    const uz = parseWordCell(row.querySelector('.w-uz').value);
    return { en: en.main, enAlt: en.alts, ru: ru.main, ruAlt: ru.alts, uz: uz.main, uzAlt: uz.alts };
  }).filter(w => w.en && w.ru && w.uz);
  if (!name || !words.length) return showToast('Name and at least one complete word (English + Russian + Uzbek) are required.', 'error');
  try {
    if (id) await apiPut('/api/vocab/units/'+id, { name, words });
    else await apiPost('/api/vocab/units', { name, words });
    closeModal('unitModal');
    await loadAll();
    showToast('Saved.', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

function escapeHtml(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

loadAll();
</script>
</body>
</html>
