<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Tommy LC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif; min-height: 100vh; color: #1A0000;
  background: linear-gradient(155deg, #B00000 0%, #8a0000 55%, #5c0000 100%);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card {
  width: 100%; max-width: 480px; background: #fff; border-radius: 20px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.35); padding: 40px 36px; text-align: center;
}
.logo-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 22px; }
.logo-row .name { font-size: 22px; font-weight: 900; color: #990000; text-align: left; line-height: 1.1; }
.logo-row .name span { display: block; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #b06060; margin-top: 2px; }
h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.4px; margin-bottom: 8px; }
.subtitle { font-size: 14px; color: #994444; margin-bottom: 28px; line-height: 1.5; }
.form-group { margin-bottom: 16px; text-align: left; }
label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #994444; margin-bottom: 7px; }
input[type="text"] {
  width: 100%; padding: 14px 16px; border: 1.5px solid #FFD0D0; border-radius: 11px;
  font-size: 16px; font-family: 'Inter', sans-serif; color: #1A0000; background: #fff;
  outline: none; transition: border-color 0.16s, box-shadow 0.16s;
}
input[type="text"]:focus { border-color: #FF0000; box-shadow: 0 0 0 3px rgba(255,0,0,0.10); }
.phone-wrap {
  display: flex; align-items: stretch; border: 1.5px solid #FFD0D0; border-radius: 11px;
  overflow: hidden; background: #fff; transition: border-color 0.16s, box-shadow 0.16s;
}
.phone-wrap:focus-within { border-color: #FF0000; box-shadow: 0 0 0 3px rgba(255,0,0,0.10); }
.phone-prefix { padding: 14px 14px; background: #FFF0F0; font-size: 15px; font-weight: 700; color: #330000; border-right: 1.5px solid #FFD0D0; user-select: none; display: flex; align-items: center; }
.phone-wrap input { border: none; outline: none; flex: 1; padding: 14px 14px; font-size: 16px; font-family: 'Inter', sans-serif; color: #1A0000; background: #fff; letter-spacing: 1px; min-width: 0; }
.error-msg {
  background: #FFF0F0; color: #8B1228; border: 1px solid #FFD0D0; border-radius: 9px;
  padding: 10px 14px; font-size: 13px; font-weight: 500; margin-bottom: 16px;
  display: none; align-items: center; gap: 8px; text-align: left;
}
.error-msg.show { display: flex; }
.btn-submit {
  width: 100%; padding: 16px; background: #FF0000; color: #fff; border: none; border-radius: 11px;
  font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer;
  transition: all 0.18s; margin-top: 8px;
}
.btn-submit:hover { background: #CC0000; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(255,0,0,0.30); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
.foot-note { font-size: 12px; color: #b06060; margin-top: 20px; line-height: 1.6; }

/* Success state */
.success-view { display: none; }
.success-view.show { display: block; }
.form-view.hide { display: none; }
.success-icon {
  width: 76px; height: 76px; border-radius: 50%; background: #E8F5E9; color: #1E6B45;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
}
.success-view h2 { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
.success-view p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 26px; }
.btn-again {
  width: 100%; padding: 14px; background: #fff; color: #990000; border: 1.5px solid #FFD0D0;
  border-radius: 11px; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif;
  cursor: pointer; transition: all 0.16s;
}
.btn-again:hover { border-color: #FF0000; background: #FFF0F0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <img src="logo.png" width="44" height="44" alt="Tommy LC" style="display:block;flex-shrink:0">
    <div class="name">Tommy LC<span>LEARNING CENTER</span></div>
  </div>

  <div class="form-view" id="formView">
    <h1>Welcome!</h1>
    <div class="subtitle">Enter your details and our team will reach out to you shortly.</div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label>First Name</label>
      <input type="text" id="fFirst" placeholder="John" autocomplete="given-name">
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <input type="text" id="fLast" placeholder="Smith" autocomplete="family-name">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <div class="phone-wrap">
        <span class="phone-prefix">+998</span>
        <input type="text" inputmode="numeric" id="fPhone" placeholder="90 123 45 67" autocomplete="tel">
      </div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitRegistration()">Register</button>
    <div class="foot-note">Your information is only used to contact you about classes.</div>
  </div>

  <div class="success-view" id="successView">
    <div class="success-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2>Thank you!</h2>
    <p>We've received your details. A member of our team will contact you soon.</p>
    <button class="btn-again" onclick="resetForm()">Register another student</button>
  </div>
</div>
<script>
function fmtPhone(input) {
  let v = input.value.replace(/\D/g,'').slice(0,9), o='';
  if (v.length>0) o += v.slice(0,2);
  if (v.length>2) o += ' ' + v.slice(2,5);
  if (v.length>5) o += ' ' + v.slice(5,7);
  if (v.length>7) o += ' ' + v.slice(7,9);
  input.value = o;
}
document.getElementById('fPhone').addEventListener('input', function() { fmtPhone(this); });

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}
function clearError() {
  document.getElementById('errorMsg').classList.remove('show');
}

let _autoResetTimer = null;

async function submitRegistration() {
  clearError();
  const firstName = document.getElementById('fFirst').value.trim();
  const lastName = document.getElementById('fLast').value.trim();
  const phoneStudent = document.getElementById('fPhone').value.trim();

  if (!firstName || !lastName) { showError('Please enter your first and last name.'); return; }
  if (phoneStudent.replace(/\D/g,'').length < 9) { showError('Please enter a valid phone number.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const res = await fetch('/api/public/lead-signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ firstName, lastName, phoneStudent })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');

    document.getElementById('formView').classList.add('hide');
    document.getElementById('successView').classList.add('show');
    _autoResetTimer = setTimeout(resetForm, 12000);
  } catch (e) {
    showError(e.message || 'Something went wrong. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Register';
  }
}

function resetForm() {
  clearTimeout(_autoResetTimer);
  document.getElementById('fFirst').value = '';
  document.getElementById('fLast').value = '';
  document.getElementById('fPhone').value = '';
  clearError();
  document.getElementById('successView').classList.remove('show');
  document.getElementById('formView').classList.remove('hide');
  document.getElementById('fFirst').focus();
}
</script>
</body>
</html>
