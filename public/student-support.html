<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Support Sessions — Tommy LC Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="student-shared.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
.sp-steps { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
.sp-step-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-light); color: var(--text-tertiary); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sp-step-dot.on { background: var(--accent); color: #fff; }
.sp-step-dot.done { background: var(--accent-dark); color: #fff; }
.sp-step-line { flex: 1; height: 2px; background: var(--border); }
.sp-step-line.done { background: var(--accent-dark); }
.sp-day-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.sp-day-tab { flex: 1; padding: 8px 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-family: 'Poppins', sans-serif; cursor: pointer; text-align: center; }
.sp-day-tab-label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-day-tab-date { font-size: 10.5px; font-weight: 500; color: var(--text-tertiary); margin-top: 1px; }
.sp-day-tab:hover { border-color: var(--accent); }
.sp-day-tab.on { border-color: var(--accent); background: var(--accent-light); }
.sp-day-tab.on .sp-day-tab-label { color: var(--accent); font-weight: 700; }
.sp-day-tab.on .sp-day-tab-date { color: var(--accent); }
.sp-day-tab:disabled { opacity: .4; cursor: not-allowed; }
.sp-day-tab:disabled:hover { border-color: var(--border); }
.sp-slot-row {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 0; border: none; border-bottom: 1px solid var(--border);
  background: none; cursor: pointer; font-family: 'Poppins', sans-serif; text-align: left;
}
.sp-slot-row:last-child { border-bottom: none; }
.sp-slot-row:hover { background: var(--accent-light); margin: 0 -20px; padding-left: 20px; padding-right: 20px; border-radius: 8px; }
.sp-slot-time-badge { width: 60px; flex-shrink: 0; text-align: center; background: var(--accent-light); border-radius: 10px; padding: 7px 0; font-size: 13px; font-weight: 700; color: var(--accent); }
.sp-slot-teacher-name { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
.sp-slot-row i { color: var(--text-tertiary); font-size: 12px; flex-shrink: 0; }
.sp-confirm-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.sp-confirm-row:last-child { border-bottom: none; }
.sp-confirm-label { color: var(--text-secondary); font-weight: 500; }
.sp-confirm-value { font-weight: 700; text-align: right; }
.sp-step-actions { display: flex; gap: 10px; margin-top: 18px; }
.sp-session-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.sp-session-item:last-child { border-bottom: none; }
.sp-session-date { width: 44px; flex-shrink: 0; text-align: center; background: var(--accent-light); border-radius: 10px; padding: 6px 0; }
.sp-session-day { font-size: 9.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--accent); }
.sp-session-num { font-size: 14px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
.sp-session-info { flex: 1; min-width: 0; }
.sp-session-meta { font-size: 12.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.sp-session-topic { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 360px) {
  .sp-day-tab-label { font-size: 11px; }
  .sp-day-tab-date { font-size: 9.5px; }
}
</style>
</head>
<body>
<div id="spHeader"></div>
<div class="sp-main">
  <div id="content" class="sp-loading">Loading…</div>
</div>
<div id="spTabbar" class="sp-tabbar"></div>
<script src="student-shared.js"></script>
<script>
spRequireAuth();
spRenderHeader('support');

const DUR = 30; // Only 30-minute support sessions are offered.
const nowTashkent = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tashkent' }));
const todayISO = nowTashkent.toISOString().split('T')[0];
// Students may only self-book for today or up to 2 days ahead — so that's exactly the
// window of days we show slots for automatically, no date picker needed.
const bookableDates = [0, 1, 2].map(n => { const d = new Date(nowTashkent); d.setDate(d.getDate() + n); return d.toISOString().split('T')[0]; });

let STATUS = null;
let STEP = 1; // 1=slot, 2=details, 3=confirm
let SLOT_DAYS = []; // [{date, slots}], one entry per bookable date, fetched together
let activeDay = null; // which of bookableDates is currently shown
let selDate = null;
let selSlot = null; // { time, teacher }
let theme = '';

async function load() {
  const el = document.getElementById('content');
  try {
    STATUS = await spGet('/api/student/support/status');
  } catch (e) { el.innerHTML = `<div class="sp-banner red">${spEscapeHtml(e.message)}</div>`; return; }
  render();
}

function fmtDateTime(d) { return new Date(d).toLocaleString('en-GB', { timeZone:'Asia/Tashkent', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }); }
function fmtDateLong(d) { return new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'2-digit', month:'long', year:'numeric' }); }
function dateParts(d) {
  const dt = new Date(String(d).slice(0,10)+'T00:00:00');
  return {
    day: dt.toLocaleDateString('en-GB', { weekday: 'short' }),
    num: dt.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit' }),
  };
}
function dayHeading(iso) {
  if (iso === bookableDates[0]) return 'Today';
  if (iso === bookableDates[1]) return 'Tomorrow';
  return new Date(iso+'T00:00:00').toLocaleDateString('en-GB', { weekday:'long' });
}

function stepsHtml() {
  const labels = ['Slot', 'Details', 'Confirm'];
  return `<div class="sp-steps">${labels.map((l, idx) => {
    const n = idx + 1;
    const cls = n < STEP ? 'done' : n === STEP ? 'on' : '';
    const dot = `<div class="sp-step-dot ${cls}" title="${l}">${n < STEP ? '✓' : n}</div>`;
    return n < labels.length ? dot + `<div class="sp-step-line ${n < STEP ? 'done' : ''}"></div>` : dot;
  }).join('')}</div>`;
}

function render() {
  const el = document.getElementById('content');
  const blocked = !!STATUS.blockedUntil || !!STATUS.bookedToday;
  let banner = '';
  if (STATUS.blockedUntil) {
    banner = `<div class="sp-banner red">You're blocked from booking support sessions until <b>${fmtDateTime(STATUS.blockedUntil)}</b> (missed too many sessions).</div>`;
  } else if (STATUS.bookedToday) {
    banner = `<div class="sp-banner amber">You already have a support session booked today at <b>${STATUS.bookedToday.time}</b> with <b>${spEscapeHtml(STATUS.bookedToday.teacher)}</b>. One session per day.</div>`;
  }

  el.innerHTML = `
    <div class="sp-title">Support Sessions</div>
    <div class="sp-subtitle">Book one free 30-minute support session a day. Missing two sessions in a month blocks booking for 30 days.</div>
    ${banner}
    ${blocked ? '' : `<div class="sp-card" id="bookCard"></div>`}
    <div class="sp-card">
      <div class="sp-card-title">My Sessions</div>
      <div id="historyBox"><div class="sp-empty">Loading…</div></div>
    </div>
  `;
  if (!blocked) renderStep();
  loadHistory();
}

function renderStep() {
  const card = document.getElementById('bookCard');
  if (!card) return;
  card.innerHTML = `${stepsHtml()}<div id="stepBody"></div>`;
  const body = document.getElementById('stepBody');
  if (STEP === 1) {
    body.innerHTML = `<div id="slotDays"><div class="sp-empty">Loading available times…</div></div>`;
    loadAllSlots();
    return;
  }
  if (STEP === 2) {
    body.innerHTML = `
      <div class="sp-field-label" style="margin-bottom:10px">${spEscapeHtml(fmtDateLong(selDate))} · ${spEscapeHtml(selSlot.time)} · ${spEscapeHtml(selSlot.teacher)}</div>
      <div class="sp-form-group">
        <label>What do you need help with?</label>
        <input type="text" class="sp-input" id="themeInput" placeholder="e.g. Unit 5 grammar, essay feedback…" maxlength="200" value="${spEscapeHtml(theme)}">
      </div>
      <div class="sp-step-actions">
        <button class="sp-btn sp-btn-outline" onclick="STEP=1;renderStep()">← Back</button>
        <button class="sp-btn sp-btn-primary" onclick="goToConfirm()">Next →</button>
      </div>
    `;
    setTimeout(() => document.getElementById('themeInput')?.focus(), 30);
    return;
  }
  if (STEP === 3) {
    body.innerHTML = `
      <div class="sp-confirm-row"><span class="sp-confirm-label">Date</span><span class="sp-confirm-value">${spEscapeHtml(fmtDateLong(selDate))}</span></div>
      <div class="sp-confirm-row"><span class="sp-confirm-label">Time</span><span class="sp-confirm-value">${spEscapeHtml(selSlot.time)} (30 min)</span></div>
      <div class="sp-confirm-row"><span class="sp-confirm-label">Teacher</span><span class="sp-confirm-value">${spEscapeHtml(selSlot.teacher)}</span></div>
      <div class="sp-confirm-row"><span class="sp-confirm-label">Topic</span><span class="sp-confirm-value">${spEscapeHtml(theme)}</span></div>
      <div class="sp-step-actions">
        <button class="sp-btn sp-btn-outline" onclick="STEP=2;renderStep()">← Back</button>
        <button class="sp-btn sp-btn-primary" id="confirmBtn" onclick="confirmBook()">Confirm Booking</button>
      </div>
    `;
  }
}

// Fetches slots for today + the next 2 days in parallel — no date picker, the full 3-day
// booking window is fetched up front — then shows one day at a time behind day tabs so
// the list doesn't turn into one long scroll of every day stacked together.
async function loadAllSlots() {
  const wrap = document.getElementById('slotDays');
  if (!wrap) return;
  try {
    SLOT_DAYS = await Promise.all(bookableDates.map(d =>
      spGet(`/api/student/support/slots?date=${encodeURIComponent(d)}&duration=${DUR}`).then(slots => ({ date: d, slots }))
    ));
  } catch (e) { wrap.innerHTML = `<div class="sp-empty">Could not load times.</div>`; return; }

  if (!SLOT_DAYS.some(d => d.slots.length)) { wrap.innerHTML = `<div class="sp-empty">No open times in the next 3 days.</div>`; return; }

  activeDay = (SLOT_DAYS.find(d => d.slots.length) || SLOT_DAYS[0]).date;
  renderSlotDays();
}

function renderSlotDays() {
  const wrap = document.getElementById('slotDays');
  if (!wrap) return;
  const active = SLOT_DAYS.find(d => d.date === activeDay);
  wrap.innerHTML = `
    <div class="sp-day-tabs">
      ${SLOT_DAYS.map(d => `<button type="button" class="sp-day-tab ${d.date===activeDay?'on':''}" onclick="selectDay('${d.date}')" ${d.slots.length?'':'disabled'}><div class="sp-day-tab-label">${spEscapeHtml(dayHeading(d.date))}</div><div class="sp-day-tab-date">${spEscapeHtml(dateParts(d.date).num)}</div></button>`).join('')}
    </div>
    <div class="sp-field-label" style="margin-bottom:10px">${spEscapeHtml(fmtDateLong(activeDay))}</div>
    ${active.slots.length ? active.slots.map(s => `
      <button type="button" class="sp-slot-row" onclick='pickSlot(${JSON.stringify({date: active.date, time: s.time, teacher: s.teacher})})'>
        <div class="sp-slot-time-badge">${spEscapeHtml(s.time)}</div>
        <div class="sp-slot-teacher-name">${spEscapeHtml(s.teacher)}</div>
        <i class="fas fa-chevron-right"></i>
      </button>
    `).join('') : `<div class="sp-empty">No open times ${spEscapeHtml(dayHeading(activeDay)).toLowerCase()}.</div>`}
  `;
}

function selectDay(date) {
  activeDay = date;
  renderSlotDays();
}

function pickSlot(slot) {
  selDate = slot.date;
  selSlot = { time: slot.time, teacher: slot.teacher };
  theme = '';
  STEP = 2;
  renderStep();
}

function goToConfirm() {
  theme = document.getElementById('themeInput').value.trim();
  if (!theme) return spToast('Tell us what you need help with.', 'error');
  STEP = 3;
  renderStep();
}

async function confirmBook() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.textContent = 'Booking…';
  try {
    await spPost('/api/student/support/book', { date: selDate, time: selSlot.time, duration: DUR, teacher: selSlot.teacher, theme });
    spToast('Session booked!');
    STEP = 1; selDate = null; selSlot = null; theme = '';
    STATUS = await spGet('/api/student/support/status');
    render();
  } catch (e) {
    spToast(e.message, 'error');
    btn.disabled = false; btn.textContent = 'Confirm Booking';
  }
}

async function loadHistory() {
  const box = document.getElementById('historyBox');
  try {
    const hist = await spGet('/api/student/support/history');
    box.innerHTML = hist.length ? hist.map(h => {
      const dp = dateParts(h.date);
      const statusBadge = h.attended===true ? '<span class="sp-badge green">Attended</span>'
        : h.attended===false ? '<span class="sp-badge red">Missed</span>'
        : '<span class="sp-badge">Pending</span>';
      return `
        <div class="sp-session-item">
          <div class="sp-session-date">
            <div class="sp-session-day">${spEscapeHtml(dp.day)}</div>
            <div class="sp-session-num">${spEscapeHtml(dp.num)}</div>
          </div>
          <div class="sp-session-info">
            <div class="sp-session-meta">${spEscapeHtml(h.time)} · ${spEscapeHtml(h.teacher)}</div>
            <div class="sp-session-topic">${spEscapeHtml(h.theme||'No topic noted')}</div>
          </div>
          ${statusBadge}
        </div>
      `;
    }).join('') : `<div class="sp-empty">No sessions booked yet.</div>`;
  } catch (e) { box.innerHTML = `<div class="sp-empty">Could not load history.</div>`; }
}

load();
spResumeTourIfActive();
</script>
</body>
</html>
