<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Student Sign In — Tommy LC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="student-shared.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="sp-auth-body">
<div class="sp-auth-page">
<div class="sp-auth-card">
  <div class="sp-logo-row">
    <img class="sp-logo-mark" src="logo.png" alt="Tommy LC">
    <div class="sp-logo-name">Tommy LC<span>STUDENT PORTAL</span></div>
  </div>
  <div class="sp-banner red" id="errorMsg" style="display:none"></div>
  <form id="loginForm" onsubmit="return doLogin(event)">
    <div class="sp-form-group">
      <label>Username</label>
      <input type="text" class="sp-input" id="username" placeholder="your.username" required autocomplete="username">
    </div>
    <div class="sp-form-group">
      <label>Password</label>
      <input type="password" class="sp-input" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="sp-btn sp-btn-primary sp-btn-block" id="submitBtn">Sign In</button>
  </form>
  <div class="sp-foot-link">Have a registration code? <a href="student-register.html">Register here</a></div>
  <button type="button" class="sp-dev-btn" id="devLoginBtn" onclick="doDevLogin()" style="display:none">🛠 Dev: Instant Login</button>
</div>
</div>
<script>
function showError(msg) { const e = document.getElementById('errorMsg'); e.textContent = msg; e.style.display = 'block'; }
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
async function doLogin(ev) {
  ev.preventDefault();
  hideError();
  const btn = document.getElementById('submitBtn');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/public/student/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Sign in failed.');
    localStorage.setItem('lc_student_session', JSON.stringify({ token: data.token, name: data.name }));
    window.location.href = 'student-portal.html';
  } catch (e) {
    showError(e.message);
    btn.disabled = false; btn.textContent = 'Sign In';
  }
  return false;
}
// Already signed in? skip straight to the portal.
try { if (JSON.parse(localStorage.getItem('lc_student_session')||'null')) window.location.replace('student-portal.html'); } catch {}

// Dev-only shortcut, hidden anywhere but a local dev server — the endpoint itself
// also refuses non-localhost requests, so this button showing is just a UI nicety.
if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  document.getElementById('devLoginBtn').style.display = '';
}
async function doDevLogin() {
  hideError();
  const btn = document.getElementById('devLoginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/public/student/dev-login', { method: 'POST' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Dev login failed.');
    localStorage.setItem('lc_student_session', JSON.stringify({ token: data.token, name: data.name }));
    window.location.href = 'student-portal.html';
  } catch (e) {
    showError(e.message);
    btn.disabled = false; btn.textContent = '🛠 Dev: Instant Login';
  }
}
</script>
</body>
</html>
