<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<!-- Discourage Chrome/Android's built-in "Translate this page" prompt — words shown here
     (practice and Learning Mode) must stay untranslated to be worth anything. -->
<meta name="google" content="notranslate">
<title>Vocabulary Practice — Tommy LC Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="student-shared.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
.sp-quiz-input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-family: 'Poppins', sans-serif; outline: none; }
.sp-quiz-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.sp-review-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.sp-review-row:last-child { border-bottom: none; }
.sp-review-correct { color: var(--green); }
.sp-review-wrong { color: var(--red); }
.sp-quiz-timer { text-align: center; font-size: 14px; font-weight: 800; color: var(--text-tertiary); margin-bottom: 6px; transition: color .2s; }
.sp-quiz-timer.low { color: var(--red); }
.sp-timer-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.sp-timer-toggle input { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
.sp-mode-row { display: flex; gap: 8px; margin-bottom: 16px; }
.sp-mode-row .sp-btn { flex: 1; }
.sp-flashcard-scene { perspective: 1200px; margin-bottom: 14px; }
.sp-flashcard { position: relative; min-height: 220px; cursor: pointer; user-select: none; }
.sp-flashcard-inner {
  position: relative; width: 100%; height: 100%; min-height: 220px;
  transition: transform .5s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d;
}
.sp-flashcard.flipped .sp-flashcard-inner { transform: rotateY(180deg); }
/* The card's own look (background/border/shadow) lives on each rotating face, not on the
   static scene wrapper — otherwise the white "card" rectangle stays put and only the text
   inside it appears to spin, instead of the whole card turning over. */
.sp-flashcard-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px;
  /* Matches .sp-card's own look exactly, since each face now stands in for the whole card. */
  background: rgba(255,255,255,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.5); border-radius: 16px; box-shadow: var(--shadow-sm);
}
.sp-flashcard-face.back { transform: rotateY(180deg); }
.sp-flashcard-word { font-size: 26px; font-weight: 700; color: #000; word-break: break-word; }
.sp-blank-word { text-align: center; font-size: 26px; font-weight: 800; letter-spacing: 4px; margin: 16px 0; font-family: 'Courier New', monospace; word-break: break-all; }
.sp-fill-feedback { margin-top: 10px; text-align: center; font-weight: 700; }
.sp-fill-feedback.correct { color: var(--green); }
.sp-fill-feedback.wrong { color: var(--red); }
.sp-quiz-option.correct-option { border-color: var(--green); background: var(--green-light); color: var(--green); font-weight: 700; }
.sp-quiz-option.wrong-option { border-color: var(--red); background: var(--red-light); color: var(--red); font-weight: 700; }
.sp-method-btn { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
.sp-count-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sp-count-chip { padding: 9px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
.sp-count-chip.on { border-color: var(--accent); background: var(--accent); color: #fff; }

@keyframes spFadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spPopIn { 0% { opacity: 0; transform: scale(.7); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
@keyframes spShakeX { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
.sp-learn-card { animation: spFadeInUp .3s ease both; }
.sp-learn-card.sp-shake { animation: spShakeX .4s ease; }
.sp-blank-word { transition: letter-spacing .2s; }
.sp-quiz-input { transition: border-color .2s, box-shadow .2s; }
.sp-quiz-input.sp-input-correct { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); }
.sp-quiz-input.sp-input-wrong { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-light); animation: spShakeX .4s ease; }
.sp-fill-feedback { animation: spPopIn .35s cubic-bezier(.4,.2,.2,1.4) both; font-size: 15px; }
.sp-quiz-option { transition: transform .15s, border-color .15s, background .15s; }
.sp-quiz-option.correct-option, .sp-quiz-option.wrong-option { animation: spPopIn .3s ease both; }
.sp-learn-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sp-learn-topbar .sp-quiz-progress { margin-bottom: 0; }
.sp-learn-back-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; flex-shrink: 0; font-size: 13px; transition: background .15s, color .15s, border-color .15s; }
.sp-learn-back-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.sp-steps { display: flex; gap: 6px; margin-bottom: 14px; }
.sp-step { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border-radius: 10px; background: var(--border); color: var(--text-tertiary); font-size: 12px; font-weight: 600; }
.sp-step span { width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.12); display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; }
.sp-step.on { background: var(--accent); color: #fff; }
.sp-step.on span { background: rgba(255,255,255,.28); }
.sp-step.done { background: var(--accent-light); color: var(--accent); }
.sp-step.done span { background: var(--accent); color: #fff; }
.sp-lu-level { padding: 8px 14px; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-tertiary); background: var(--accent-light); border-bottom: 1px solid var(--border); }
.sp-lu-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.sp-lu-row:last-child { border-bottom: none; }
.sp-lu-row input { width: 17px; height: 17px; accent-color: var(--accent); flex-shrink: 0; }
.sp-lu-main { flex: 1; min-width: 0; }
.sp-lu-name { font-size: 13.5px; font-weight: 600; }
.sp-lu-bar { height: 5px; background: var(--border); border-radius: 10px; overflow: hidden; margin: 6px 0 4px; }
.sp-lu-bar div { height: 100%; background: var(--green); border-radius: 10px; transition: width .3s; }
.sp-lu-sub { font-size: 11px; color: var(--text-tertiary); }
.sp-weak-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; margin-bottom: 14px; border-radius: 14px; background: var(--amber-light); border: 1px solid var(--amber); }
.sp-weak-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.sp-weak-sub { font-size: 12px; color: var(--text-secondary); }
.sp-nav-row { display: flex; gap: 10px; margin-top: 4px; }
.sp-nav-row .sp-btn { flex: 1; }
.sp-method-list { display: flex; flex-direction: column; gap: 10px; }
.sp-method-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; font-family: 'Poppins', sans-serif; }
.sp-method-card:hover, .sp-method-card.open { border-color: var(--accent); background: var(--accent-light); }
.sp-method-icon { font-size: 24px; }
.sp-method-text { display: flex; flex-direction: column; gap: 2px; }
.sp-method-text b { font-size: 14px; color: var(--text-primary); }
.sp-method-text small { font-size: 12px; color: var(--text-secondary); }
.sp-diff { display: flex; gap: 8px; }
.sp-diff .sp-btn { flex: 1; padding-left: 4px; padding-right: 4px; }
.sp-flash-hint { text-align: center; color: var(--text-tertiary); font-size: 13px; margin-top: 4px; }
.sp-flash-actions { gap: 10px; margin-top: 4px; }
.sp-flash-actions .sp-btn { flex: 1; }
.sp-stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 14px; }
.sp-stat { text-align: center; padding: 12px 6px; border-radius: 12px; background: var(--border); }
.sp-stat b { display: block; font-size: 22px; font-weight: 800; }
.sp-stat span { font-size: 11px; color: var(--text-secondary); }
.sp-stat.good { background: var(--green-light); } .sp-stat.good b { color: var(--green); }
.sp-stat.bad { background: var(--red-light); } .sp-stat.bad b { color: var(--red); }
.sp-missed-list { max-height: 200px; overflow-y: auto; margin-bottom: 14px; padding: 0 4px; }
.sp-done-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.sp-wheel-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 2px 0 4px; }
.sp-wheel-wrap { position: relative; width: 92px; height: 108px; }
.sp-wheel { position: relative; z-index: 1; height: 108px; overflow-y: auto; scroll-snap-type: y mandatory; scroll-padding-top: 36px; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
.sp-wheel::-webkit-scrollbar { display: none; }
.sp-wheel-pad { height: 36px; }
.sp-wheel-item { height: 36px; display: flex; align-items: center; justify-content: center; scroll-snap-align: start; font-size: 16px; font-weight: 600; color: var(--text-tertiary); cursor: pointer; transition: color .15s, font-size .15s; user-select: none; }
.sp-wheel-item.on { color: var(--accent); font-size: 24px; font-weight: 800; }
.sp-wheel-hl { position: absolute; left: 0; right: 0; top: 36px; height: 36px; border-radius: 12px; background: var(--accent-light); pointer-events: none; }
.sp-wheel-unit { font-size: 14px; font-weight: 600; color: var(--text-secondary); min-width: 44px; }
</style>
</head>
<body>
<div id="spHeader"></div>
<div class="sp-main">
  <div id="content" class="sp-loading">Loading…</div>
</div>
<div id="spTabbar" class="sp-tabbar"></div>
<script src="student-shared.js"></script>
<script>
spRequireAuth();
spRenderHeader('vocab');

let UNITS = [], SELECTED = new Set();
let SESSION = null; // { sessionId, questions, languagePair }
let ANSWERS = {};
let CUR = 0;

// ── Learning Mode — flashcards / fill-in-the-letters / multiple choice. Purely for
// self-study: nothing here is scored, timed, or saved to any history (see the graded
// Practice Mode above/below for that). ──
let MODE = 'practice'; // 'practice' | 'learn'
let LEARN_SELECTED = new Set();
let LEARN_METHOD = null; // 'flashcards' | 'fill' | 'mcq'
let LEARN_WORDS = [];
let LEARN_IDX = 0;
let LEARN_FLIPPED = false;
let LEARN_CURRENT_BLANK = '';
let LEARN_FILL_RESULT = null; // null | 'correct' | 'wrong'
let LEARN_FILL_DIFFICULTY = 'medium'; // 'easy' | 'medium' | 'hard'
let LEARN_MCQ_PICKED = null;
let LEARN_STEP = 1;           // setup wizard: 1 units · 2 word count · 3 method
let LEARN_SOURCE = 'units';   // 'units' | 'weak' (the student's mistakes)
let LEARN_PROGRESS = null;    // { units: { id: { total, revised } }, weakCount }
let LEARN_RESULTS = [];       // this session: [{ w, ok }]
let LEARN_FILL_OPEN = false;
let LEARN_FILL_TIMER = null;

// ── Per-word timer (student can turn this off; unlike the graded test, it's optional here) ──
// Each word gets 15s, but time isn't reset per word — whatever's left when the student
// moves on (by answering or skipping) rolls into the next word's allowance, so unused
// time from easy words banks up for harder ones later.
const TIME_PER_WORD = 15;
let TIMER_BANK = TIME_PER_WORD;
let TIMER_INTERVAL = null;
// The bank counts down against a wall-clock deadline rather than "one tick = one second
// gone" — a backgrounded tab has its setInterval throttled (or paused) by the browser, so
// counting ticks lets a student bank extra real time just by switching away and back.
// Deriving the remaining time from Date.now() instead means switching tabs can never add
// time: whatever real seconds actually passed are always what get deducted.
let TIMER_DEADLINE = null;
function timerEnabled() { return localStorage.getItem('sp_vocab_timer') !== 'off'; }
function setTimerEnabled(on) { localStorage.setItem('sp_vocab_timer', on ? 'on' : 'off'); }
function startTimer() {
  stopTimer();
  if (!timerEnabled()) return;
  TIMER_DEADLINE = Date.now() + TIMER_BANK * 1000;
  tickTimer();
  TIMER_INTERVAL = setInterval(tickTimer, 250);
}
function tickTimer() {
  TIMER_BANK = Math.max(0, Math.ceil((TIMER_DEADLINE - Date.now()) / 1000));
  renderTimer();
  if (TIMER_BANK <= 0) { stopTimer(); handleTimeout(); }
}
function stopTimer() {
  if (TIMER_INTERVAL) { clearInterval(TIMER_INTERVAL); TIMER_INTERVAL = null; }
  // Settle the bank to the real elapsed time before it's read (e.g. by leaveWord) —
  // otherwise a word answered right after the tab regains visibility would still show
  // however many seconds were left at the last tick, not what's actually left now.
  if (TIMER_DEADLINE != null) { TIMER_BANK = Math.max(0, Math.ceil((TIMER_DEADLINE - Date.now()) / 1000)); TIMER_DEADLINE = null; }
}
function renderTimer() {
  const el = document.getElementById('qTimer');
  if (!el) return;
  el.textContent = TIMER_BANK + 's';
  el.classList.toggle('low', TIMER_BANK <= 5);
}
// Whatever's left on the clock when leaving a word carries into the next word, plus a
// fresh +15s — but only the FIRST time a given word is left. Each word gets exactly one
// +15s allowance to grant, no matter how it's left (answered, skipped, or timed out);
// without that guard, skipping the same word every time it cycles back around would
// re-grant +15s forever, letting a student stockpile unlimited time.
const ROLLED_QIDS = new Set();
function leaveWord(qid) {
  stopTimer();
  if (!ROLLED_QIDS.has(qid)) { TIMER_BANK += TIME_PER_WORD; ROLLED_QIDS.add(qid); }
}
function handleTimeout() {
  if (!SESSION || CUR >= SESSION.questions.length) return;
  const q = SESSION.questions[CUR];
  ANSWERS[q.qid] = '';
  leaveWord(q.qid);
  if (CUR < SESSION.questions.length - 1) { CUR++; renderQuestion(); return; }
  submitPractice();
}

async function showPicker() {
  const el = document.getElementById('content');
  el.innerHTML = `<div class="sp-loading">Loading units…</div>`;
  try {
    UNITS = await spGet('/api/student/vocab/units');
  } catch (e) { el.innerHTML = `<div class="sp-banner red">${spEscapeHtml(e.message)}</div>`; return; }
  // Arriving from a Home-screen recommendation (?unit=ID) — pre-check that unit.
  const preselect = new URLSearchParams(location.search).get('unit');
  if (preselect && UNITS.some(u => u.id === preselect)) { SELECTED.add(preselect); LEARN_SELECTED.add(preselect); }
  renderModeShell();
}

function renderModeShell() {
  if (MODE === 'learn') renderLearnPicker();
  else renderPracticePicker();
}

function switchMode(m) {
  MODE = m;
  renderModeShell();
}

function modeToggleHtml() {
  return `
    <div class="sp-title">Vocabulary</div>
    <div class="sp-subtitle">${MODE === 'practice'
      ? 'Timed practice with scoring — results save to your history.'
      : 'Study at your own pace — nothing here is scored or saved.'}</div>
    <div class="sp-mode-row">
      <button class="sp-btn ${MODE==='practice'?'sp-btn-primary':'sp-btn-outline'}" onclick="switchMode('practice')">📝 Practice Mode</button>
      <button class="sp-btn ${MODE==='learn'?'sp-btn-primary':'sp-btn-outline'}" onclick="switchMode('learn')">🧠 Learning Mode</button>
    </div>
  `;
}

function unitPickListHtml(selectedSet, toggleFn) {
  if (!UNITS.length) return `<div class="sp-empty">No units available for your level yet — ask your admin.</div>`;
  // UNITS already comes back sorted level-then-unit-number; only add level headers
  // when more than one level is present (e.g. no group assigned yet) so it's clear
  // why the numbering restarts, instead of it just looking out of order.
  const levels = [...new Set(UNITS.map(u => u.level))];
  const itemHtml = u => `
    <label class="sp-pick-item">
      <input type="checkbox" ${selectedSet.has(u.id)?'checked':''} onchange="${toggleFn}('${u.id}', this.checked)">
      <div>
        <div style="font-size:13.5px;font-weight:600">${spEscapeHtml(u.name)}</div>
        <div style="font-size:11.5px;color:var(--text-tertiary)">${u.wordCount} word${u.wordCount===1?'':'s'}${levels.length>1?'':' · '+spEscapeHtml(u.level)}</div>
      </div>
    </label>`;
  return levels.length > 1
    ? levels.map(lvl => `
        <div style="padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-tertiary);background:var(--accent-light);border-bottom:1px solid var(--border)">${spEscapeHtml(lvl)}</div>
        ${UNITS.filter(u => u.level === lvl).map(itemHtml).join('')}
      `).join('')
    : UNITS.map(itemHtml).join('');
}

function renderPracticePicker() {
  const el = document.getElementById('content');
  el.innerHTML = `
    ${modeToggleHtml()}
    <div class="sp-card">
      <div class="sp-card-title">Choose Unit(s)</div>
      <div class="sp-pick-list" id="unitList"></div>
      <label class="sp-timer-toggle">
        <div>
          <div style="font-size:13.5px;font-weight:600">⏱ 15s per word timer</div>
          <div style="font-size:11.5px;color:var(--text-tertiary)">Unused time rolls into the next word</div>
        </div>
        <input type="checkbox" ${timerEnabled()?'checked':''} onchange="setTimerEnabled(this.checked)">
      </label>
      <button class="sp-btn sp-btn-primary" id="startPracticeBtn" style="margin-top:14px" onclick="startPractice()">Start Practice</button>
    </div>
    <div class="sp-card">
      <div class="sp-card-title">My Unit Progress</div>
      <div id="progressBox"><div class="sp-empty">Loading…</div></div>
    </div>
  `;
  document.getElementById('unitList').innerHTML = unitPickListHtml(SELECTED, 'toggleUnit');
  loadProgress();
}
function toggleUnit(id, checked) { if (checked) SELECTED.add(id); else SELECTED.delete(id); }

async function renderLearnPicker() {
  if (!LEARN_PROGRESS) {
    document.getElementById('content').innerHTML = `${modeToggleHtml()}<div class="sp-loading">Loading…</div>`;
    try { LEARN_PROGRESS = await spGet('/api/student/vocab/learn/progress'); }
    catch (e) { LEARN_PROGRESS = { units: {}, weakCount: 0 }; }
    if (MODE !== 'learn') return; // student switched to Practice while this was loading
  }
  if (LEARN_STEP === 1) renderLearnStepUnits();
  else if (LEARN_STEP === 2) renderLearnStepCount();
  else renderLearnStepMethod();
}
function learnGoStep(n) {
  if (n === 2 && !LEARN_SELECTED.size) { spToast('Pick at least one unit.', 'error'); return; }
  LEARN_SOURCE = 'units';
  LEARN_FILL_OPEN = false;
  LEARN_STEP = n;
  renderLearnPicker();
}
function startWeakFlow() { LEARN_SOURCE = 'weak'; LEARN_FILL_OPEN = false; LEARN_STEP = 3; renderLearnPicker(); }

function learnStepperHtml() {
  const labels = ['Units', 'Words', 'Method'];
  return `<div class="sp-steps">${labels.map((l, i) => {
    const n = i + 1;
    const cls = LEARN_STEP === n ? ' on' : (LEARN_STEP > n || (LEARN_SOURCE === 'weak' && n < 3)) ? ' done' : '';
    return `<div class="sp-step${cls}"><span>${cls === ' done' ? '✓' : n}</span>${l}</div>`;
  }).join('')}</div>`;
}

function learnUnitRowsHtml() {
  const prog = LEARN_PROGRESS.units;
  const levels = [...new Set(UNITS.map(u => u.level))];
  const row = u => {
    const p = prog[u.id] || { total: u.wordCount, revised: 0 };
    const pct = p.total ? Math.round(p.revised / p.total * 100) : 0;
    return `<label class="sp-lu-row">
      <input type="checkbox" ${LEARN_SELECTED.has(u.id) ? 'checked' : ''} onchange="toggleLearnUnit('${u.id}', this.checked)">
      <div class="sp-lu-main">
        <div class="sp-lu-name">${spEscapeHtml(u.name)}</div>
        <div class="sp-lu-bar"><div style="width:${pct}%"></div></div>
        <div class="sp-lu-sub">${p.revised} / ${p.total} words revised${pct === 100 ? ' ✓' : ''}</div>
      </div>
    </label>`;
  };
  if (!UNITS.length) return `<div class="sp-empty">No units available for your level yet — ask your admin.</div>`;
  return levels.length > 1
    ? levels.map(l => `<div class="sp-lu-level">${spEscapeHtml(l)}</div>${UNITS.filter(u => u.level === l).map(row).join('')}`).join('')
    : UNITS.map(row).join('');
}

function renderLearnStepUnits() {
  const weak = LEARN_PROGRESS.weakCount || 0;
  document.getElementById('content').innerHTML = `
    ${modeToggleHtml()}
    ${learnStepperHtml()}
    ${weak ? `<div class="sp-weak-card">
      <div><div class="sp-weak-title">${weak} word${weak === 1 ? '' : 's'} to review</div><div class="sp-weak-sub">Words you missed recently</div></div>
      <button type="button" class="sp-btn sp-btn-primary" onclick="startWeakFlow()">Practise</button>
    </div>` : ''}
    <div class="sp-card">
      <div class="sp-card-title">Choose Unit(s)</div>
      <div class="sp-pick-list">${learnUnitRowsHtml()}</div>
    </div>
    <button type="button" class="sp-btn sp-btn-primary" id="learnNextBtn" style="width:100%" ${LEARN_SELECTED.size ? '' : 'disabled'} onclick="learnGoStep(2)">Continue</button>
  `;
}
function toggleLearnUnit(id, checked) {
  if (checked) LEARN_SELECTED.add(id); else LEARN_SELECTED.delete(id);
  const btn = document.getElementById('learnNextBtn');
  if (btn) btn.disabled = !LEARN_SELECTED.size;
}

// "How many words?" — lets a student revise e.g. 20 of a 150-word unit at a time instead
// of the whole thing. LEARN_COUNT null means "all remaining unrevised words".
let LEARN_COUNT = null;
let LEARN_AVAILABLE = 0; // words the current LEARN_SELECTED/count choice can draw from
let _learnCountsToken = 0;
function renderLearnStepCount() {
  document.getElementById('content').innerHTML = `
    ${modeToggleHtml()}
    ${learnStepperHtml()}
    <div class="sp-card">
      <div class="sp-card-title">How Many Words?</div>
      <div class="sp-empty" id="learnCountInfo" style="padding:0 0 12px">Checking your progress…</div>
      <div class="sp-wheel-row">
        <div class="sp-wheel-wrap">
          <div class="sp-wheel-hl"></div>
          <div class="sp-wheel" id="learnWheel"></div>
        </div>
        <div class="sp-wheel-unit" id="learnWheelLabel">words</div>
      </div>
    </div>
    <div class="sp-nav-row">
      <button type="button" class="sp-btn sp-btn-outline" onclick="learnGoStep(1)">← Back</button>
      <button type="button" class="sp-btn sp-btn-primary" onclick="learnGoStep(3)">Continue</button>
    </div>
  `;
  refreshLearnCounts();
}
async function refreshLearnCounts() {
  const info = document.getElementById('learnCountInfo');
  if (!info) return;
  const token = ++_learnCountsToken;
  let counts;
  try {
    counts = await spGet('/api/student/vocab/learn/counts?unitIds=' + [...LEARN_SELECTED].map(encodeURIComponent).join(','));
  } catch (e) { if (token === _learnCountsToken) info.textContent = e.message; return; }
  if (token !== _learnCountsToken) return;
  const { total, unrevised } = counts;
  LEARN_AVAILABLE = unrevised || total; // 0 unrevised = fully revised, next session starts a fresh cycle over all of them
  if (LEARN_COUNT === null || LEARN_COUNT > LEARN_AVAILABLE) LEARN_COUNT = Math.min(20, LEARN_AVAILABLE);
  info.textContent = unrevised
    ? `${unrevised} of ${total} word${total===1?'':'s'} not yet revised`
    : `All ${total} word${total===1?'':'s'} revised — starting a fresh round`;
  renderLearnWheel();
}
// Scroll-wheel number picker: the number sitting in the highlighted middle row is the
// amount of words for the session (1 up to the words still unrevised).
const WHEEL_ITEM_H = 36;
function renderLearnWheel() {
  const box = document.getElementById('learnWheel');
  if (!box) return;
  const n = LEARN_AVAILABLE;
  box.innerHTML = '<div class="sp-wheel-pad"></div>'
    + Array.from({ length: n }, (_, i) => `<div class="sp-wheel-item" data-n="${i + 1}">${i + 1}</div>`).join('')
    + '<div class="sp-wheel-pad"></div>';
  const paint = () => {
    box.querySelectorAll('.sp-wheel-item').forEach(el => el.classList.toggle('on', +el.dataset.n === LEARN_COUNT));
    const label = document.getElementById('learnWheelLabel');
    if (label) label.textContent = LEARN_COUNT === 1 ? 'word' : 'words';
  };
  box.onscroll = () => {
    const v = Math.min(n, Math.max(1, Math.round(box.scrollTop / WHEEL_ITEM_H) + 1));
    if (v !== LEARN_COUNT) { LEARN_COUNT = v; paint(); }
  };
  box.onclick = e => {
    const el = e.target.closest('.sp-wheel-item');
    if (el) box.scrollTo({ top: (+el.dataset.n - 1) * WHEEL_ITEM_H, behavior: 'smooth' });
  };
  box.scrollTop = (LEARN_COUNT - 1) * WHEEL_ITEM_H;
  paint();
}

function renderLearnStepMethod() {
  const card = (key, icon, title, desc, onclick) => `
    <button type="button" class="sp-method-card${LEARN_FILL_OPEN && key === 'fill' ? ' open' : ''}" onclick="${onclick}">
      <span class="sp-method-icon">${icon}</span>
      <span class="sp-method-text"><b>${title}</b><small>${desc}</small></span>
    </button>`;
  const back = LEARN_SOURCE === 'weak' ? 1 : 2;
  document.getElementById('content').innerHTML = `
    ${modeToggleHtml()}
    ${learnStepperHtml()}
    <div class="sp-card">
      <div class="sp-card-title">${LEARN_SOURCE === 'weak' ? 'Practise Mistakes — Choose a Method' : 'Choose a Method'}</div>
      <div class="sp-method-list">
        ${card('flashcards', '📇', 'Flashcards', 'Flip each card, then tell us if you knew it.', "startLearn('flashcards')")}
        ${card('fill', '✍️', 'Fill in the Letters', 'Complete the missing letters of the word.', 'toggleFillOpen()')}
        ${LEARN_FILL_OPEN ? `<div class="sp-diff">
          <button type="button" class="sp-btn sp-btn-outline" onclick="startLearn('fill','easy')">🟢 Easy</button>
          <button type="button" class="sp-btn sp-btn-outline" onclick="startLearn('fill','medium')">🟡 Medium</button>
          <button type="button" class="sp-btn sp-btn-outline" onclick="startLearn('fill','hard')">🔴 Hard</button>
        </div>` : ''}
        ${card('mcq', '🔘', 'Multiple Choice', 'Pick the right answer from the options.', "startLearn('mcq')")}

    </div>

function toggleFillOpen() { LEARN_FILL_OPEN = !LEARN_FILL_OPEN; renderLearnStepMethod(); }

// Per-unit status from official graded tests: Passed / Not passed / Not tested.
let PROGRESS_UNITS = [], PROGRESS_FILTER = 'all';
async function loadProgress() {
  const box = document.getElementById('progressBox');
  try {
    PROGRESS_UNITS = await spGet('/api/student/vocab/progress');
    PROGRESS_FILTER = 'all';
    renderProgress();
  } catch (e) { box.innerHTML = `<div class="sp-empty">Could not load progress.</div>`; }
}
function setProgressFilter(f) { PROGRESS_FILTER = f; renderProgress(); }
function renderProgress() {
  const box = document.getElementById('progressBox');
  const units = PROGRESS_UNITS;
  if (!units.length) { box.innerHTML = `<div class="sp-empty">No units available for your level yet.</div>`; return; }
  const count = st => units.filter(u => u.status === st).length;
  const badge = { passed: '<span class="sp-badge green">Passed</span>', failed: '<span class="sp-badge red">Not passed</span>', none: '<span class="sp-badge">Not tested</span>' };
  const filters = [['all', 'All', units.length], ['passed', 'Passed', count('passed')], ['failed', 'Not passed', count('failed')], ['none', 'Not tested', count('none')]];
  const shown = PROGRESS_FILTER === 'all' ? units : units.filter(u => u.status === PROGRESS_FILTER);
  box.innerHTML = `
    <div class="sp-count-chips" style="margin-bottom:10px">
      ${filters.map(([k, label, n]) => `<button type="button" class="sp-count-chip${PROGRESS_FILTER===k?' on':''}" style="padding:6px 12px;font-size:12px" onclick="setProgressFilter('${k}')">${label} ${n}</button>`).join('')}
    </div>
    <div style="max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px">
      ${shown.length ? shown.map(u => `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)">
          <div style="min-width:0">
            <div style="font-size:13px;font-weight:600">${spEscapeHtml(u.name)}</div>
            <div style="font-size:11px;color:var(--text-tertiary)">${u.best ? `Best ${u.best.score}/${u.best.total}` : `${u.wordCount} word${u.wordCount===1?'':'s'}`}${u.practicePassed ? ' · practice passed' : ''}</div>
          </div>
          ${badge[u.status]}
        </div>`).join('') : `<div class="sp-empty">No units here.</div>`}
    </div>`;
}

async function startPractice() {
  if (!SELECTED.size) { spToast('Pick at least one unit.', 'error'); return; }
  try {
    SESSION = await spPost('/api/student/vocab/practice/start', { unitIds: [...SELECTED] });
    ANSWERS = {}; CUR = 0; TIMER_BANK = TIME_PER_WORD; ROLLED_QIDS.clear();
    renderQuestion();
  } catch (e) { spToast(e.message, 'error'); }
}

function renderQuestion() {
  const el = document.getElementById('content');
  const total = SESSION.questions.length;
  const q = SESSION.questions[CUR];
  el.innerHTML = `
    <div class="sp-card">
      <div class="sp-quiz-progress">Question ${CUR+1} of ${total}</div>
      <div class="sp-quiz-timer" id="qTimer" style="${timerEnabled()?'':'display:none'}"></div>
      <div class="sp-quiz-prompt">${spEscapeHtml(q.prompt)}</div>
      ${q.options ? `
        <div class="sp-quiz-options" id="optWrap">
          ${q.options.map(o => `<button type="button" class="sp-quiz-option" onclick="pickOption('${spJsStrAttr(o)}', this)">${spEscapeHtml(o)}</button>`).join('')}
        </div>
      ` : `
        <input type="text" class="sp-quiz-input" id="freeAnswer" placeholder="Type the English word…" autocomplete="off" autofocus onkeydown="if(event.key==='Enter')nextQuestion()">
      `}
      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:18px">
        ${CUR < total - 1 ? `<button class="sp-btn sp-btn-outline" onclick="skipQuestion()">Skip</button>` : '<span></span>'}
        <button class="sp-btn sp-btn-primary" onclick="nextQuestion()">${CUR===total-1?'Finish':'Next →'}</button>
      </div>
    </div>
  `;
  if (!q.options) setTimeout(() => document.getElementById('freeAnswer')?.focus(), 30);
  startTimer();
}

function pickOption(val, btn) {
  ANSWERS[SESSION.questions[CUR].qid] = val;
  document.querySelectorAll('#optWrap .sp-quiz-option').forEach(b => b.classList.remove('picked'));
  btn.classList.add('picked');
}

// Sends the current word to the back of the queue instead of answering it — the word
// isn't removed or scored, it just comes back around later (each question keeps its own
// qid, so this reordering never affects how answers are matched up when scoring).
function skipQuestion() {
  const [q] = SESSION.questions.splice(CUR, 1);
  SESSION.questions.push(q);
  leaveWord(q.qid);
  renderQuestion();
}

async function nextQuestion() {
  const q = SESSION.questions[CUR];
  if (!q.options) {
    const v = document.getElementById('freeAnswer').value.trim();
    if (v) ANSWERS[q.qid] = v;
  }
  leaveWord(q.qid);
  if (CUR < SESSION.questions.length - 1) { CUR++; renderQuestion(); return; }
  await submitPractice();
}

async function submitPractice() {
  stopTimer();
  const el = document.getElementById('content');
  el.innerHTML = `<div class="sp-loading">Scoring…</div>`;
  try {
    const answers = Object.entries(ANSWERS).map(([qid, given]) => ({ qid: Number(qid), given }));
    const r = await spPost(`/api/student/vocab/practice/${SESSION.sessionId}/submit`, { answers });
    renderResult(r);
  } catch (e) {
    spToast(e.message, 'error');
    showPicker();
  }
}

function renderResult(r) {
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="sp-card">
      <div class="sp-card-title">Result</div>
      <div class="sp-result-score ${r.passed?'pass':'fail'}">${r.score} / ${r.total}</div>
      <div style="text-align:center;margin-bottom:18px">${r.passed ? '<span class="sp-badge green">Passed 🎉</span>' : '<span class="sp-badge red">Keep practicing</span>'}</div>
      <div id="reviewList">
        ${r.details.map(d => `<div class="sp-review-row">
          <span>${spEscapeHtml(d.prompt)}</span>
          <span class="${d.correct?'sp-review-correct':'sp-review-wrong'}">${spEscapeHtml(d.given||'—')}${d.correct?'':' (→ '+spEscapeHtml(d.expected)+')'}</span>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="sp-btn sp-btn-outline" onclick="showPicker()">Back to Units</button>
        <button class="sp-btn sp-btn-primary" onclick="startPractice()">Practice Again</button>
      </div>
    </div>
  `;
}

/* ══════════════════════════════════════════ LEARNING MODE ══════════════════════════════════════════ */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

async function startLearn(method, fillDifficulty) {
  try {
    let words;
    if (LEARN_SOURCE === 'weak') {
      words = (await spGet('/api/student/vocab/learn/weak')).words;
    } else {
      if (!LEARN_SELECTED.size) { spToast('Pick at least one unit.', 'error'); return; }
      const unitIds = [...LEARN_SELECTED].map(encodeURIComponent).join(',');
      const count = LEARN_COUNT ? `&count=${LEARN_COUNT}` : '';
      const r = await spGet(`/api/student/vocab/learn?unitIds=${unitIds}${count}`);
      if (r.cycled) spToast("You've revised every word here — starting a fresh round.");
      words = r.words;
    }
    if (!words.length) { spToast('No words to study here yet.', 'error'); return; }
    if (method === 'mcq' && words.length < 4) { spToast('Multiple choice needs at least 4 words — try Flashcards or Fill in the Letters.', 'error'); return; }
    beginLearnSession(words, method, fillDifficulty);
  } catch (e) { spToast(e.message, 'error'); }
}

function beginLearnSession(words, method, fillDifficulty) {
  clearTimeout(LEARN_FILL_TIMER);
  LEARN_WORDS = shuffleArray(words.map(w => ({ key: w.key, en: w.en, enAlt: w.enAlt || [], back: w.back })));
  LEARN_METHOD = method;
  if (fillDifficulty) LEARN_FILL_DIFFICULTY = fillDifficulty;
  LEARN_IDX = 0;
  LEARN_FLIPPED = false;
  LEARN_CURRENT_BLANK = '';
  LEARN_FILL_RESULT = null;
  LEARN_MCQ_PICKED = null;
  LEARN_RESULTS = [];
  renderLearnSession();
}

function exitLearnSession() {
  clearTimeout(LEARN_FILL_TIMER);
  LEARN_STEP = 1; LEARN_SOURCE = 'units'; LEARN_FILL_OPEN = false; LEARN_PROGRESS = null;
  renderLearnPicker();
}

function restartLearn() { startLearn(LEARN_METHOD); }

// Re-drills just the words missed this session, in the same method.
function practiseMissed() {
  const missed = LEARN_RESULTS.filter(r => !r.ok).map(r => r.w);
  if (!missed.length) return;
  const method = (LEARN_METHOD === 'mcq' && missed.length < 4) ? 'flashcards' : LEARN_METHOD;
  beginLearnSession(missed, method);
}

function renderLearnSession() {
  if (LEARN_METHOD === 'fill') renderFillLetters();
  else if (LEARN_METHOD === 'mcq') renderMCQ();
  else renderFlashcard();
}

// Records how one word went. Wrong answers are flagged server-side as mistakes (feeding
// the "words to review" shortcut on the setup screen); a later right answer clears the flag.
function recordLearnResult(w, ok) {
  LEARN_RESULTS.push({ w, ok });
  if (w?.key) spPost('/api/student/vocab/learn/weak', { key: w.key, correct: ok }).catch(() => {});
}

function renderLearnDone() {
  clearTimeout(LEARN_FILL_TIMER);
  LEARN_PROGRESS = null; // setup screen reloads fresh progress next time
  const total = LEARN_RESULTS.length;
  const ok = LEARN_RESULTS.filter(r => r.ok).length;
  const missed = LEARN_RESULTS.filter(r => !r.ok);
  const pct = total ? Math.round(ok / total * 100) : 0;
  const flash = LEARN_METHOD === 'flashcards';
  const barColor = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
  document.getElementById('content').innerHTML = `
    <div class="sp-card sp-learn-card">
      <div style="text-align:center">
        <div style="font-size:38px;margin-bottom:6px">${pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪'}</div>
        <div class="sp-card-title" style="justify-content:center">Session Complete</div>
      </div>
      <div class="sp-stat-tiles">
        <div class="sp-stat"><b>${total}</b><span>Words</span></div>
        <div class="sp-stat good"><b>${ok}</b><span>${flash ? 'Got it' : 'Correct'}</span></div>
        <div class="sp-stat bad"><b>${missed.length}</b><span>${flash ? 'Still learning' : 'Missed'}</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:4px 0 16px">
        <div style="flex:1;background:var(--border);border-radius:20px;height:8px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${barColor}"></div></div>
        <div style="font-weight:800;color:${barColor}">${pct}%</div>
      </div>
      ${missed.length ? `
        <div class="sp-card-title" style="font-size:13px">To review</div>
        <div class="sp-missed-list">${missed.map(r => `<div class="sp-review-row"><span>${spEscapeHtml(r.w.back)}</span><span class="sp-review-wrong">${spEscapeHtml(r.w.en)}</span></div>`).join('')}</div>
      ` : `<div style="text-align:center;color:var(--green);font-weight:600;margin-bottom:6px">No mistakes — great work!</div>`}
      <div class="sp-done-actions">
        ${missed.length ? `<button class="sp-btn sp-btn-primary" onclick="practiseMissed()">Practise ${missed.length} mistake${missed.length === 1 ? '' : 's'}</button>` : ''}
        <div style="display:flex;gap:10px">
          <button class="sp-btn sp-btn-outline" style="flex:1" onclick="exitLearnSession()">Back to Units</button>
          <button class="sp-btn ${missed.length ? 'sp-btn-outline' : 'sp-btn-primary'}" style="flex:1" onclick="restartLearn()">Study Again</button>
        </div>
      </div>
    </div>
  `;
}

// ── Flashcards ──
// Tap the card to flip it and reveal the English word, then say whether you knew it
// ("Got it" / "Still learning") — that choice is what feeds the end-of-session summary
// and the mistakes review.
function renderFlashcard() {
  const el = document.getElementById('content');
  const total = LEARN_WORDS.length;
  const w = LEARN_WORDS[LEARN_IDX];
  el.innerHTML = `
    <div class="sp-learn-topbar">
      <button type="button" class="sp-learn-back-btn" onclick="exitLearnSession()" aria-label="Back to units"><i class="fas fa-arrow-left"></i></button>
      <div class="sp-quiz-progress">Card ${LEARN_IDX+1} of ${total}</div>
    </div>
    <div class="sp-flashcard-scene">
      <div class="sp-flashcard${LEARN_FLIPPED?' flipped':''}" id="flashcardEl" onclick="handleFlashcardTap()">
        <div class="sp-flashcard-inner">
          <div class="sp-flashcard-face front"><div class="sp-flashcard-word">${spEscapeHtml(w.back)}</div></div>
          <div class="sp-flashcard-face back"><div class="sp-flashcard-word">${spEscapeHtml(w.en)}</div></div>
        </div>
      </div>
    </div>
    <div class="sp-flash-hint" id="flashHint">Tap the card to reveal the answer</div>
    <div class="sp-flash-actions" id="flashActions" style="display:none">
      <button type="button" class="sp-btn sp-btn-outline" onclick="rateFlashcard(false)">Still learning</button>
      <button type="button" class="sp-btn sp-btn-primary" onclick="rateFlashcard(true)">Got it</button>
    </div>
  `;
}
// Fire-and-forget: only counts once the student has actually moved past a word, never
// for the one on screen when they quit — so an interrupted session leaves exactly the
// words not yet reached still unrevised, ready to come up again next time.
function markLearnWordRevised(w) {
  if (w?.key) spPost('/api/student/vocab/learn/progress', { key: w.key }).catch(() => {});
}

function handleFlashcardTap() {
  LEARN_FLIPPED = !LEARN_FLIPPED;
  document.getElementById('flashcardEl')?.classList.toggle('flipped', LEARN_FLIPPED);
  const hint = document.getElementById('flashHint'), actions = document.getElementById('flashActions');
  if (hint) hint.style.display = LEARN_FLIPPED ? 'none' : '';
  if (actions) actions.style.display = LEARN_FLIPPED ? 'flex' : 'none';
}
function rateFlashcard(ok) {
  const w = LEARN_WORDS[LEARN_IDX];
  recordLearnResult(w, ok);
  markLearnWordRevised(w);
  LEARN_FLIPPED = false;
  if (LEARN_IDX < LEARN_WORDS.length - 1) { LEARN_IDX++; renderFlashcard(); }
  else renderLearnDone();
}

// ── Fill in the Letters ──
// Keeps the first/last letter of the word visible and blanks out roughly half of the
// rest — a stable pattern computed once per word (not on every re-render), so it
// doesn't reshuffle while the student is looking at it.
const FILL_BLANK_RATIO = { easy: 0.3, medium: 0.55, hard: 0.8 };
function blankWord(word) {
  const ratio = FILL_BLANK_RATIO[LEARN_FILL_DIFFICULTY] ?? FILL_BLANK_RATIO.medium;
  return word.split('').map((ch, i, arr) => {
    if (!/[a-zA-Z]/.test(ch)) return ch;
    if (i === 0 || i === arr.length - 1) return ch;
    return Math.random() < ratio ? '_' : ch;
  }).join('');
}
function renderFillLetters() {
  const el = document.getElementById('content');
  const total = LEARN_WORDS.length;
  const w = LEARN_WORDS[LEARN_IDX];
  if (!LEARN_CURRENT_BLANK) LEARN_CURRENT_BLANK = blankWord(w.en);
  el.innerHTML = `
    <div class="sp-learn-topbar">
      <button type="button" class="sp-learn-back-btn" onclick="exitLearnSession()" aria-label="Back to units"><i class="fas fa-arrow-left"></i></button>
      <div class="sp-quiz-progress">Word ${LEARN_IDX+1} of ${total} · ${LEARN_FILL_DIFFICULTY[0].toUpperCase()+LEARN_FILL_DIFFICULTY.slice(1)}</div>
    </div>
    <div class="sp-card sp-learn-card${LEARN_FILL_RESULT==='wrong'?' sp-shake':''}">
      <div class="sp-quiz-prompt" style="margin-bottom:6px">${spEscapeHtml(w.back)}</div>
      <div class="sp-blank-word">${spEscapeHtml(LEARN_CURRENT_BLANK.toUpperCase())}</div>
      <input type="text" class="sp-quiz-input${LEARN_FILL_RESULT==='correct'?' sp-input-correct':LEARN_FILL_RESULT==='wrong'?' sp-input-wrong':''}" id="fillAnswer" placeholder="Type the full word…" autocomplete="off" autofocus
        onkeydown="if(event.key==='Enter')checkFill()" ${LEARN_FILL_RESULT?'disabled':''}>
      ${LEARN_FILL_RESULT ? `
        <div class="sp-fill-feedback ${LEARN_FILL_RESULT}">${LEARN_FILL_RESULT==='correct' ? '✓ Correct!' : '✗ Answer: ' + spEscapeHtml(w.en)}</div>
      ` : ''}
    </div>
    <div style="margin-top:16px">
      <button class="sp-btn sp-btn-primary" style="width:100%" onclick="${LEARN_FILL_RESULT?'nextFill()':'checkFill()'}">${LEARN_FILL_RESULT ? (LEARN_IDX===total-1?'Finish':'Next →') : 'Check'}</button>
    </div>
  `;
  if (!LEARN_FILL_RESULT) setTimeout(() => document.getElementById('fillAnswer')?.focus(), 30);
  clearTimeout(LEARN_FILL_TIMER);
  if (LEARN_FILL_RESULT) LEARN_FILL_TIMER = setTimeout(nextFill, 2000);
}
function checkFill() {
  const input = document.getElementById('fillAnswer');
  const v = input.value.trim().toLowerCase();
  if (!v) return;
  const w = LEARN_WORDS[LEARN_IDX];
  const accepted = [w.en, ...(w.enAlt||[])].map(s => s.trim().toLowerCase());
  LEARN_FILL_RESULT = accepted.includes(v) ? 'correct' : 'wrong';
  recordLearnResult(w, LEARN_FILL_RESULT === 'correct');
  renderFillLetters();
}
function nextFill() {
  if (LEARN_METHOD !== 'fill' || !LEARN_FILL_RESULT) return;
  clearTimeout(LEARN_FILL_TIMER);
  markLearnWordRevised(LEARN_WORDS[LEARN_IDX]);
  LEARN_FILL_RESULT = null;
  LEARN_CURRENT_BLANK = '';
  if (LEARN_IDX < LEARN_WORDS.length - 1) { LEARN_IDX++; renderFillLetters(); }
  else renderLearnDone();
}

// ── Multiple Choice ──
function renderMCQ() {
  const el = document.getElementById('content');
  const total = LEARN_WORDS.length;
  const w = LEARN_WORDS[LEARN_IDX];
  if (!w._options) {
    // De-dupe by translation, not just by word object — two different vocab entries can
    // share the same English translation (synonyms, or the same word across units), which
    // would otherwise show two identical-looking answer buttons.
    const pool = [...new Set(LEARN_WORDS.filter((x,i) => i !== LEARN_IDX).map(x => x.en))].filter(en => en !== w.en);
    const distractors = shuffleArray(pool).slice(0, 3);
    w._options = shuffleArray([w.en, ...distractors]);
  }
  el.innerHTML = `
    <div class="sp-learn-topbar">
      <button type="button" class="sp-learn-back-btn" onclick="exitLearnSession()" aria-label="Back to units"><i class="fas fa-arrow-left"></i></button>
      <div class="sp-quiz-progress">Word ${LEARN_IDX+1} of ${total}</div>
    </div>
    <div class="sp-learn-card${LEARN_MCQ_PICKED && LEARN_MCQ_PICKED!==w.en?' sp-shake':''}">
      <div class="sp-quiz-prompt">${spEscapeHtml(w.back)}</div>
      <div class="sp-quiz-options">
        ${w._options.map(o => {
          let cls = 'sp-quiz-option';
          if (LEARN_MCQ_PICKED) {
            if (o === w.en) cls += ' correct-option';
            else if (o === LEARN_MCQ_PICKED) cls += ' wrong-option';
          }
          return `<button type="button" class="${cls}" ${LEARN_MCQ_PICKED?'disabled':''} onclick="pickMCQ('${spJsStrAttr(o)}')">${spEscapeHtml(o)}</button>`;
        }).join('')}
      </div>
    </div>
    <div style="margin-top:18px">
      <button class="sp-btn sp-btn-primary" style="width:100%" ${LEARN_MCQ_PICKED?'':'disabled'} onclick="nextMCQ()">${LEARN_IDX===total-1?'Finish':'Next →'}</button>
    </div>
  `;
}
function pickMCQ(val) {
  if (LEARN_MCQ_PICKED) return;
  LEARN_MCQ_PICKED = val;
  recordLearnResult(LEARN_WORDS[LEARN_IDX], val === LEARN_WORDS[LEARN_IDX].en);
  renderMCQ();
}
function nextMCQ() {
  if (!LEARN_MCQ_PICKED) return;
  markLearnWordRevised(LEARN_WORDS[LEARN_IDX]);
  LEARN_MCQ_PICKED = null;
  if (LEARN_IDX < LEARN_WORDS.length - 1) { LEARN_IDX++; renderMCQ(); }
  else renderLearnDone();
}

showPicker();
spResumeTourIfActive();
</script>
</body>
</html>
