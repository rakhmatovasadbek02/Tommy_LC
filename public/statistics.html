<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics — TommyLC CRM</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#990000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TommyLC">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    /* ── Statistics — scoped under .stat-page so its .card/.card-title overrides never
       bleed into the plain shared.css .card look used elsewhere ── */
    .stat-page { padding-bottom:64px; --cr:#c0392b; --sg:#16a34a; --sb:#2563eb; --sa:#d97706; --sp:#7c3aed; }
    .stat-page .sec { margin-bottom:40px; }
    .stat-page .sec-hd { display:flex; align-items:center; gap:10px; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #f0dede; }
    .stat-page .sec-icon { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .stat-page .sec-icon svg { width:15px; height:15px; }
    .stat-page .sec-hd h2 { font-size:14px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:var(--text); margin:0; }
    .stat-page .sec-meta { font-size:12px; color:var(--muted); margin-left:auto; font-weight:500; }
    .stat-page .card { background:white; border:1px solid #f0dede; border-radius:16px; padding:22px 24px; box-shadow:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.04); }
    .stat-page .card-title { font-size:11px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 20px; }
    .stat-page .g2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .stat-page .g3 { display:grid; grid-template-columns:3fr 2fr; gap:14px; }
    @media(max-width:1100px){ .stat-page .g3{ grid-template-columns:1fr; } }
    @media(max-width:860px){ .stat-page .g2{ grid-template-columns:1fr; } }

    .sta-tabs { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:22px; padding-bottom:6px; border-bottom:1px solid #f0dcdc; position:sticky; top:0; background:var(--bg,#fff); z-index:5; }
    .sta-tab { border:0; background:transparent; padding:9px 14px; border-radius:10px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; flex-shrink:0; }
    .sta-tab.on { background:#c0392b; color:#fff; }
    .sta-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .sta-kpi { text-align:center; padding:14px 8px !important; }
    .sta-kpi-v { font-size:26px; font-weight:900; line-height:1.1; }
    .sta-kpi-l { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-top:4px; }
    .sta-kpi-s { font-size:11px; color:var(--muted); margin-top:2px; }
    .sta-alert { display:flex; align-items:center; gap:10px; padding:10px 6px; border-top:1px solid #fae8e8; font-size:13px; cursor:pointer; }
    .sta-alert:first-child { border-top:0; }
    .sta-alert .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .sta-alert.red .dot { background:#dc2626; } .sta-alert.amber .dot { background:#d97706; }
    .sta-alert .go { margin-left:auto; color:var(--muted); }
    .sta-subtabs { margin-bottom:16px !important; border-bottom:0 !important; } .sta-subtabs .sta-tab { background:#f7eded; } .sta-subtabs .sta-tab.on { background:#c0392b; color:#fff; }
    .stbl a { color:inherit; font-weight:700; text-decoration:none; } .stbl a:hover { text-decoration:underline; }
    .linechart-wrap { position:relative; width:100%; }
    .linechart-legend { display:flex; gap:20px; margin-bottom:14px; flex-wrap:wrap; }
    .lc-dot { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:5px; }
    .lc-label { font-size:12px; color:var(--text); font-weight:600; }
    .linechart-svg { width:100%; overflow:visible; display:block; }
    .linechart-tooltip { position:absolute; background:rgba(20,10,10,.88); color:white; border-radius:8px; padding:8px 12px; font-size:12px; pointer-events:none; white-space:nowrap; opacity:0; transition:opacity .15s; z-index:10; }
    .linechart-tooltip.show { opacity:1; }
    .funnel { display:flex; flex-direction:column; gap:7px; }
    .f-row { display:flex; align-items:center; gap:10px; }
    .f-lbl { font-size:12px; font-weight:600; color:var(--text); width:88px; flex-shrink:0; text-align:right; }
    .f-track { flex:1; height:36px; background:#fdf2f2; border-radius:8px; overflow:hidden; min-width:0; }
    .f-fill { height:100%; border-radius:8px; display:flex; align-items:center; padding-left:12px; transition:width .7s cubic-bezier(.4,0,.2,1); }
    .f-fill span { font-size:12px; font-weight:800; color:rgba(255,255,255,.95); white-space:nowrap; }
    .f-n { font-size:12px; font-weight:800; color:var(--text); width:28px; text-align:right; flex-shrink:0; }
    @media(max-width:480px){ .f-lbl{ width:60px; font-size:11px; } }
    .gauge-card { display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:10px; gap:2px; }
    .gauge-num { font-size:44px; font-weight:900; color:var(--cr); letter-spacing:-3px; line-height:1; margin-top:-6px; }
    .gauge-lbl { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
    .gauge-sub { font-size:12px; color:var(--muted); margin-top:6px; }
    .donut-wrap { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
    .donut-legend { flex:1; min-width:0; display:flex; flex-direction:column; gap:9px; }
    .dl-row { display:flex; align-items:center; gap:8px; }
    .dl-sw { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
    .dl-lbl { font-size:12.5px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dl-pct { font-size:12px; font-weight:800; color:var(--text); }
    .dl-amt { font-size:10px; color:var(--muted); margin-left:2px; }
    .tscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .stbl { width:100%; border-collapse:collapse; min-width:340px; }
    .stbl th { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); padding:0 8px 10px; text-align:left; white-space:nowrap; }
    .stbl th:not(:first-child) { text-align:right; }
    .stbl td { padding:8px; border-top:1px solid #fae8e8; font-size:13px; color:var(--text); vertical-align:middle; }
    .stbl td:not(:first-child) { text-align:right; }
    .stbl tbody tr:hover td { background:#fdf7f7; }
    .sname { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; white-space:nowrap; }
    .savatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:white; flex-shrink:0; }
    .rate-cell { display:flex; align-items:center; gap:6px; justify-content:flex-end; }
    .rate-track { width:52px; height:5px; background:#f3e8e8; border-radius:99px; overflow:hidden; }
    .rate-fill { height:100%; border-radius:99px; }
    .rate-pct { font-size:11px; font-weight:800; min-width:30px; text-align:right; }
    .arch-pills { display:flex; flex-wrap:wrap; gap:8px; }
    .arch-pill { display:flex; align-items:center; gap:6px; background:#fdf2f2; border:1px solid #f5d0d0; border-radius:99px; padding:6px 14px 6px 10px; }
    .arch-pill-n { font-size:14px; font-weight:900; color:var(--cr); }
    .arch-pill-l { display:none; }
    .refresh-tag { font-size:11px; color:var(--muted); font-weight:500; }
    @media(max-width:640px){
      .stat-page .card { padding:16px; }
      .stat-page .sec-hd { flex-wrap:wrap; }
      .stat-page { padding-bottom:40px; }
      .stat-page .g2 { grid-template-columns:1fr !important; }
      .stat-page .g3 { grid-template-columns:1fr !important; }
      .f-row { flex-wrap:wrap; }
      .f-lbl { width:auto !important; }
      .dl-row { flex-wrap:wrap; }
      .arch-pills { gap:6px; }
      .arch-pill { padding:5px 10px 5px 8px; }
    }

    /* ═══ Statistics visual polish ═══ */
    .stat-page { font-variant-numeric:tabular-nums; --line:#f1e4e4; }
    .stat-page .sec { margin-bottom:30px; }
    .stat-page .sec-hd { border-bottom:0; padding-bottom:0; margin-bottom:14px; }
    .stat-page .sec-hd h2 { font-size:18px; letter-spacing:-.2px; text-transform:none; font-weight:800; }
    .stat-page .sec-meta { background:#f7eded; border-radius:999px; padding:4px 11px; font-size:12px; font-weight:600; }
    .stat-page .card { border:1px solid var(--line); border-radius:18px; padding:20px 22px; box-shadow:0 1px 2px rgba(60,20,20,.05); transition:box-shadow .15s, transform .15s; }
    .stat-page .card-title { font-size:12px; letter-spacing:.5px; margin:0 0 14px; color:#6b5555; }
    .stat-page .g2, .stat-page .g3 { gap:16px; }

    /* tabs */
    .sta-tabs { background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px; gap:4px; box-shadow:0 1px 2px rgba(60,20,20,.05); margin-bottom:24px; border-bottom:1px solid var(--line); top:8px; }
    .sta-tab { padding:9px 16px; font-size:13.5px; border-radius:10px; transition:background .15s, color .15s; }
    .sta-tab:hover:not(.on) { background:#f7eded; color:var(--text); }
    .sta-tab.on { background:#c0392b; color:#fff; box-shadow:0 2px 6px rgba(192,57,43,.35); }
    .sta-subtabs { box-shadow:none; background:transparent; border:0; padding:0; margin-bottom:18px !important; flex-wrap:wrap; overflow:visible; }
    .sta-subtabs .sta-tab { background:#fff; border:1px solid var(--line); font-size:13px; padding:7px 14px; border-radius:999px; }
    .sta-subtabs .sta-tab.on { background:#c0392b; border-color:#c0392b; }

    /* KPI cards */
    .sta-kpis { gap:14px; }
    .sta-kpi { text-align:left; padding:16px 18px !important; position:relative; overflow:hidden; border-left:4px solid var(--k,#c0392b) !important; }
    .sta-kpi.click { cursor:pointer; }
    .sta-kpi.click:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(60,20,20,.10); }
    .sta-kpi-v { font-size:28px; font-weight:900; letter-spacing:-1px; }
    .sta-kpi-l { font-size:12px; font-weight:700; text-transform:none; letter-spacing:0; color:#4a3a3a; margin-top:6px; }
    .sta-kpi-s { font-size:12px; color:var(--muted); margin-top:3px; }

    /* alerts */
    .sta-alert { border:0; border-left:4px solid; border-radius:10px; margin:8px 0; padding:11px 14px; transition:transform .12s; }
    .sta-alert:hover { transform:translateX(3px); }
    .sta-alert.red { background:#fef2f2; border-color:#dc2626; } .sta-alert.amber { background:#fffbeb; border-color:#d97706; }
    .sta-alert .go { font-weight:800; }

    /* bar lists */
    .sbars { display:flex; flex-direction:column; gap:12px; }
    .sbar-top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-bottom:5px; }
    .sbar-l { font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .sbar-v { font-size:13px; font-weight:800; flex-shrink:0; }
    .sbar-track { height:10px; background:#f7eded; border-radius:999px; overflow:hidden; }
    .sbar-fill { height:100%; border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1); }
    .scols { display:flex; align-items:flex-end; gap:3px; border-bottom:1px solid var(--line); }
    .scols > div { flex:1; min-width:2px; border-radius:4px 4px 0 0; }
    .sta-empty { color:var(--muted); font-size:13px; padding:14px 0; text-align:center; background:#fbf6f6; border-radius:10px; }

    /* tables */
    .stbl th { background:#fbf6f6; padding:9px 10px; font-size:11px; border-bottom:1px solid var(--line); }
    .stbl th:first-child { border-radius:8px 0 0 8px; } .stbl th:last-child { border-radius:0 8px 8px 0; }
    .stbl td { padding:11px 10px; border-top:1px solid #f6ecec; }
    .stbl tbody tr:hover td { background:#fdf8f8; }
    .stat-page .rate-track { height:8px; border-radius:999px; }


    .srow { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #f6ecec; }
    .srow:last-child { border-bottom:0; }
    .srow-l { font-size:13px; color:#4a3a3a; }
    .srow-v { font-size:16px; font-weight:800; }
    .stat-page .gauge-num { font-size:40px; letter-spacing:-2px; }
    .stat-page .gauge-card { padding:6px 0 4px; }
    .stat-page .f-track { height:34px; border-radius:10px; background:#f7eded; }
    .stat-page .f-fill { border-radius:10px; }
    .stat-page .f-n { display:none; }
    .stat-page .f-lbl { width:96px; font-size:12.5px; }
    .stat-page .sname { display:flex; align-items:center; gap:10px; font-weight:600; }
    .stat-page .arch-pill { background:#f7eded; border:1px solid var(--line); border-radius:999px; }
    @media(max-width:600px){
      .stat-page .card { padding:16px; border-radius:16px; }
      .sta-kpis { grid-template-columns:repeat(2,1fr); gap:10px; }
      .sta-kpi { padding:13px 14px !important; } .sta-kpi-v { font-size:23px; }
      .stat-page .sec-hd h2 { font-size:16px; }
      .sta-tab { padding:8px 12px; font-size:13px; }
    }
  </style>
</head>
<body>
<nav class="sidebar"></nav>

<div class="main">
  <div class="topbar">
    <div class="page-title">Statistics</div>
    <div class="topbar-right">
      <select class="input" id="monthPicker" style="width:auto;padding:6px 10px;font-size:13px" onchange="staChangeMonth(this.value)"></select>
      <span class="refresh-tag" id="refreshedAt"></span>
    </div>
  </div>
  <div class="page-content">
    <div id="statContent" class="stat-page">
      <div style="text-align:center;padding:80px 0;color:var(--muted)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="opacity:.35;display:block;margin:0 auto 12px"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Loading…
      </div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
requireAuth('statistics');
renderSidebar('statistics');

/* ══════════════════════════════════════════ STATISTICS (sta-prefixed) ══════════════════════════════════════════ */
const staFmt  = n => Number(n||0).toLocaleString('ru-RU');
const staFmtM = n => { const v=Number(n||0); if(v>=1e6) return (v/1e6).toFixed(1)+'M'; if(v>=1e3) return (v/1e3).toFixed(0)+'K'; return staFmt(v); };
const staPct  = (a,b) => b>0 ? Math.round(a/b*100) : 0;
const STA_PAL = ['#c0392b','#2563eb','#7c3aed','#d97706','#16a34a','#0891b2','#be185d'];

function staBgColor(name) {
  let h=0; for(let i=0;i<(name||'').length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return STA_PAL[h%STA_PAL.length];
}
function staIni(n) { const p=(n||'').trim().split(/\s+/); return (p[0]?.[0]||'')+(p[1]?.[0]||''); }

function staLineChartSVG(series, months, containerId) {
  const W=800, H=220, PL=52, PR=16, PT=16, PB=28;
  const cW=W-PL-PR, cH=H-PT-PB;
  const n = months.length;
  if (n < 2) return `<div style="color:var(--muted);font-size:13px;text-align:center;padding:40px 0">Not enough data — need at least 2 months</div>`;

  const allVals = series.flatMap(s=>s.values);
  const maxV = Math.max(...allVals, 1);
  const step = cW / (n-1);

  function xOf(i) { return PL + i*step; }
  function yOf(v) { return PT + cH - (v/maxV)*cH; }

  const ticks = 4;
  let grid='', yLabels='';
  for(let i=0;i<=ticks;i++){
    const v = maxV*(i/ticks);
    const y = yOf(v);
    grid += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#f0dede" stroke-width="1"/>`;
    yLabels += `<text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="9" fill="#bbb" font-family="Inter,sans-serif">${staFmtM(v)}</text>`;
  }

  let xLabels='';
  months.forEach((m,i)=>{
    xLabels += `<text x="${xOf(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#bbb" font-family="Inter,sans-serif">${m.slice(5)}</text>`;
  });

  const SCOLS = ['#c0392b','#2563eb','#16a34a'];
  let paths='';
  series.forEach((s,si)=>{
    const col = SCOLS[si%SCOLS.length];
    const areaD = `M${xOf(0)},${yOf(s.values[0])} ` +
      s.values.map((v,i)=>`L${xOf(i)},${yOf(v)}`).join(' ') +
      ` L${xOf(n-1)},${PT+cH} L${xOf(0)},${PT+cH} Z`;
    paths += `<path d="${areaD}" fill="${col}" fill-opacity="0.07"/>`;
    const lineD = `M${xOf(0)},${yOf(s.values[0])} ` + s.values.map((v,i)=>`L${xOf(i)},${yOf(v)}`).join(' ');
    paths += `<path d="${lineD}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.values.forEach((v,i)=>{
      paths += `<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3.5" fill="${col}" stroke="white" stroke-width="1.5" class="lc-dot-pt" data-series="${esc(s.label)}" data-val="${v}" data-month="${months[i]}" data-x="${xOf(i)}" data-y="${yOf(v)}"/>`;
    });
  });

  let hovers='';
  months.forEach((m,i)=>{
    const vals = series.map(s=>`${s.label}:${s.values[i]}`).join('|');
    hovers += `<rect x="${xOf(i)-step/2}" y="${PT}" width="${step}" height="${cH}" fill="transparent" class="lc-hover" data-month="${m}" data-vals="${vals}" data-x="${xOf(i)}"/>`;
  });

  return `<svg class="linechart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="${containerId}">
    ${grid}${yLabels}${xLabels}${paths}${hovers}
    <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="#f0dede" stroke-width="1"/>
  </svg>`;
}

function staDonutSVG(slices) {
  const r=46,cx=54,cy=54,sw=13,circ=2*Math.PI*r;
  const total=slices.reduce((s,x)=>s+x.v,0);
  if(!total) return `<svg width="108" height="108"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f5e0e0" stroke-width="${sw}"/></svg>`;
  let off=0;
  const arcs=slices.map(s=>{
    const len=circ*(s.v/total)-1.2;
    const a=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,len)} ${circ-Math.max(0,len)}" stroke-dashoffset="${-(off*circ/total-circ/4)}" stroke-linecap="butt"/>`;
    off+=s.v; return a;
  }).join('');
  return `<svg width="108" height="108" viewBox="0 0 108 108" style="flex-shrink:0">${arcs}</svg>`;
}

function staGaugeSVG(val) {
  const r=50,cx=70,cy=68,sw=12,circ=Math.PI*r;
  const filled=circ*(Math.min(val,100)/100);
  const col = val>=70 ? '#16a34a' : val>=40 ? '#d97706' : '#c0392b';
  return `<svg width="160" height="86" viewBox="0 0 140 78">
    <path d="M${cx-r},${cy} A${r},${r} 0 0,1 ${cx+r},${cy}" fill="none" stroke="#f3e4e4" stroke-width="${sw}" stroke-linecap="round"/>
    <path d="M${cx-r},${cy} A${r},${r} 0 0,1 ${cx+r},${cy}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${filled} ${circ}"/>
  </svg>`;
}

// One month selection drives the whole page — every event-based figure (revenue, new
// leads, conversions, portal signups/attempts/sessions, staff efficiency) is scoped to it.
// Pure current-state snapshots (active student count, the live lead funnel, archive
// tallies) have no historical record to show instead, so they stay "as of right now".
let SELECTED_MONTH = null; // null = let the server default to the current month
let STA_TAB = (location.hash || '').slice(1) || 'overview';
async function staLoad() {
  const [d, sys, pi] = await Promise.all([
    apiGet('/api/statistics' + (SELECTED_MONTH ? `?month=${SELECTED_MONTH}` : '')),
    apiGet('/api/statistics/system').catch(e => ({ _error: e.message || String(e) })),
    apiGet('/api/statistics/portal').catch(e => ({ _error: e.message || String(e) })),
  ]);
  SELECTED_MONTH = d.month; // reflect the server's resolved default back into the picker
  const picker = document.getElementById('monthPicker');
  if (picker.dataset.built !== '1') { picker.innerHTML = staMonthOptions(); picker.dataset.built = '1'; }
  picker.value = SELECTED_MONTH;
  document.getElementById('refreshedAt').textContent =
    'Updated ' + new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  staRender(d, sys, pi);
}
function staChangeMonth(month) {
  SELECTED_MONTH = month;
  staLoad();
}
function staMonthOptions() {
  const opts = [];
  const d = new Date();
  for (let i = 0; i < 12; i++) {
    const y = d.getFullYear(), m = d.getMonth() - i;
    const dt = new Date(y, m, 1);
    const val = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    const label = dt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    opts.push(`<option value="${val}">${label}</option>`);
  }
  return opts.join('');
}

function staRender(d, sys, pi) {

  const revSeries     = months.map(m => F.revenueByMonth?.[m]||0);
  const pendingSeries = months.map(m => F.pendingByMonth?.[m]||0);
  const spendSeries   = months.map(m => F.spendingByMonth?.[m]||0);

  const series = [
    { label:'Net Revenue', values:revSeries },

  const P_PORTAL = `

          <div class="gauge-card">

          return `<div style="display:flex;gap:16px;justify-content:space-between"><span style="opacity:.8">${lbl}</span><strong>${staFmtM(Number(num))}</strong></div>`;

      });

        tip.style.top  = (e.clientY - rect.top - 16)+'px';
      });
      el.addEventListener('mouseleave', () => tip.classList.remove('show'));
    });

/* ── Category shell: tabs + Overview + Students/Groups tabs ── */
const STA_TABS = [
  ['overview', 'Overview'], ['students', 'Students'], ['groups', 'Groups & Attendance'],
  ['leads', 'Leads'], ['finance', 'Finance'], ['staff', 'Staff'], ['portal', 'Student Portal'],
];
function staSetTab(t) {
  if (!STA_TABS.some(x => x[0] === t)) t = 'overview';
  STA_TAB = t;
  try { history.replaceState(null, '', '#' + t); } catch {}
  document.querySelectorAll('.sta-tab[data-tab]').forEach(b => { const on = b.dataset.tab === t; b.classList.toggle('on', on); if (on) b.scrollIntoView({ block: 'nearest', inline: 'center' }); });
  document.querySelectorAll('.sta-panel').forEach(p => { p.style.display = p.dataset.tab === t ? '' : 'none'; });
}
function staNoData(msg) { return `<div class="card" style="color:#c0392b;font-size:13px">${esc(msg)}</div>`; }
function staKpi(l, v, c, sub, tab) {
  return `<div class="card sta-kpi${tab ? ' click' : ''}" style="--k:${c}" ${tab ? `onclick="staSetTab('${tab}')"` : ''}>
    <div class="sta-kpi-v" style="color:${c}">${v}</div><div class="sta-kpi-l">${l}</div>${sub ? `<div class="sta-kpi-s">${sub}</div>` : ''}</div>`;
}
function staTable(head, rows, empty) {
  return `<div class="tscroll"><table class="stbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${head.length}" style="text-align:center;color:var(--muted);padding:16px 0">${empty}</td></tr>`}</tbody></table></div>`;
}
function staSection(title, meta, inner) {
  return `<div class="sec"><div class="sec-hd"><h2>${title}</h2>${meta ? `<span class="sec-meta">${meta}</span>` : ''}</div>${inner}</div>`;
}
function staShell(P, d, sys, pi) {
  const {students:S, leads:L, finance:F, staff:ST, archive:AR, portal:PO} = d;
  const sysOk = sys && !sys._error, piOk = pi && !pi._error;

  /* ---- alerts: what needs attention right now ---- */
  const alerts = [];
  const add = (lvl, text, tab) => alerts.push({ lvl, text, tab });
  if (S.debtors > 0) add(S.debtors >= 10 ? 'red' : 'amber', `<b>${S.debtors}</b> students have a negative balance (total ${staFmtM(S.totalBalance)})`, 'students');
  if (sysOk) {
    if (sys.overdue.n > 0) add('red', `<b>${sys.overdue.n}</b> unpaid invoices from earlier months (${staFmtM(sys.overdue.amount)} UZS)`, 'finance');
    if (sys.staleLeads > 0) add('amber', `<b>${sys.staleLeads}</b> leads still "New/Contacted" after 14+ days`, 'leads');
    if (sys.lowAttendanceGroups.some(g => g.rate < 70)) add('red', `<b>${sys.lowAttendanceGroups.filter(g => g.rate < 70).length}</b> groups below 70% attendance (30 days)`, 'groups');
    if (sys.absentees.length) add('amber', `<b>${sys.absentees.length}</b> students absent 3+ times in 14 days`, 'groups');
    if (sys.groups.empty > 0) add('amber', `<b>${sys.groups.empty}</b> groups have no active students`, 'groups');
  }
  if (piOk) {
    if (pi.dormant.length) add('amber', `<b>${pi.dormant.length}+</b> portal users inactive for 14+ days`, 'portal');
    const unans = (pi.feedback || []).reduce((t, r) => t + r.unanswered, 0);
    if (unans) add('amber', `<b>${unans}</b> student feedback messages awaiting a reply`, 'portal');
  }
  if (PO.codesPending > 0) add('amber', `<b>${PO.codesPending}</b> portal registration codes issued but not used yet`, 'portal');
  if (S.total && PO.adoptionRate < 50) add('amber', `Portal adoption is only <b>${PO.adoptionRate}%</b>`, 'portal');

  const alertHTML = alerts.length
    ? alerts.map(a => `<div class="sta-alert ${a.lvl}" onclick="staSetTab('${a.tab}')"><span class="dot"></span><span>${a.text}</span><span class="go">→</span></div>`).join('')
    : `<div style="color:#16a34a;font-weight:700;padding:10px 0">✓ Nothing needs attention right now</div>`;

  const overview = `
    ${staSection('Key numbers', `${esc(d.month)}`, `<div class="sta-kpis">
      ${staKpi('Active students', S.active, '#16a34a', `${S.total} total · ${S.inactive} inactive`, 'students')}
      ${staKpi('Debtors', S.debtors, S.debtors ? '#dc2626' : '#16a34a', 'negative balance', 'students')}
      ${staKpi('Revenue this month', staFmtM(F.thisMonthRevenue), '#c0392b', `prev ${staFmtM(F.prevMonthRevenue)}`, 'finance')}
      ${staKpi('Pending payments', staFmtM(F.pendingRevenue), '#d97706', `${staFmtM(F.totalSpendings || 0)} spent total`, 'finance')}
      ${staKpi('Leads', L.total, '#2563eb', `${L.leadsThisMonth} new · ${L.conversionRate || 0}% convert`, 'leads')}
      ${staKpi('Attendance (30d)', sysOk && sys.attendance.rate != null ? sys.attendance.rate + '%' : '—', '#7c3aed', sysOk ? `${sys.groups.total} groups` : '', 'groups')}
      ${staKpi('Portal adoption', PO.adoptionRate + '%', '#0891b2', `${PO.accountsCreated} accounts`, 'portal')}
      ${staKpi('Active on portal (7d)', piOk ? pi.active7 : '—', '#16a34a', piOk ? `${pi.active30} in 30 days` : '', 'portal')}
    </div>`)}
    ${staSection('Needs attention', `${alerts.length} item${alerts.length === 1 ? '' : 's'}`, `<div class="card">${alertHTML}</div>`)}`;

  /* ---- students tab ---- */
  const lvlRows = sysOk ? sys.byLevel : [];
  const students = staSection('Students', `${S.total} total`, `
    <div class="sta-kpis" style="margin-bottom:14px">
      ${staKpi('Active', S.active, '#16a34a')}${staKpi('Inactive', S.inactive, '#6b7280')}
      ${staKpi('Debtors', S.debtors, '#dc2626')}${staKpi('Total balance', staFmtM(S.totalBalance), S.totalBalance < 0 ? '#dc2626' : '#16a34a')}
    </div>
    ${sysOk ? `<div class="g2" style="margin-bottom:14px">
      <div class="card"><div class="card-title">Active students by level</div>${staBars(lvlRows, 'n', r => r.level, '#2563eb')}</div>
      <div class="card"><div class="card-title">New students · last 6 months</div>${staBars(sys.newByMonth, 'n', r => r.month, '#16a34a')}</div>
    </div>
    <div class="g2">
      <div class="card"><div class="card-title">Top debtors</div>${staTable(['Student', 'Group', 'Balance'], sys.debtors.map(r => `<tr><td><a href="student-profile.html?id=${encodeURIComponent(r.id)}">${esc(r.name)}</a></td><td>${esc(r.group || '—')}</td><td style="color:#dc2626;font-weight:800">${staFmt(r.balance)}</td></tr>`), 'No debtors 🎉')}</div>
      <div class="card"><div class="card-title">By status</div>${staBars(sys.byStatus, 'n', r => r.status, '#7c3aed')}
        <div class="card-title" style="margin-top:18px">Archived · by reason</div><div class="arch-pills">${P.archHTML}</div></div>
    </div>` : staNoData('Student details failed to load: ' + (sys && sys._error))}`);

  /* ---- groups tab ---- */
  const groups = sysOk ? staSection('Groups & Attendance', `${sys.groups.total} groups · avg ${sys.groups.avgSize} students`, `
    <div class="sta-kpis" style="margin-bottom:14px">
      ${staKpi('Attendance (30d)', sys.attendance.rate != null ? sys.attendance.rate + '%' : '—', '#7c3aed', `${sys.attendance.present}/${sys.attendance.total} marks`)}
      ${staKpi('Groups', sys.groups.total, '#2563eb')}${staKpi('Avg group size', sys.groups.avgSize, '#0891b2')}
      ${staKpi('Empty groups', sys.groups.empty, sys.groups.empty ? '#d97706' : '#16a34a')}
    </div>
    <div class="g2" style="margin-bottom:14px">
      <div class="card"><div class="card-title">Lowest attendance groups</div>${staTable(['Group', 'Teacher', 'Rate'], sys.lowAttendanceGroups.map(g => `<tr><td><a href="group.html?id=${encodeURIComponent(g.id)}">${esc(g.name)}</a></td><td>${esc(g.teacher || '—')}</td><td style="font-weight:800;color:${g.rate < 70 ? '#dc2626' : g.rate < 85 ? '#d97706' : '#16a34a'}">${g.rate}%</td></tr>`), 'Not enough attendance data')}</div>
      <div class="card"><div class="card-title">Frequently absent · last 14 days</div>${staTable(['Student', 'Group', 'Absences'], sys.absentees.map(r => `<tr><td><a href="student-profile.html?id=${encodeURIComponent(r.id)}">${esc(r.name)}</a></td><td>${esc(r.group || '—')}</td><td style="font-weight:800">${r.absences}</td></tr>`), 'No repeat absentees')}</div>
    </div>
    <div class="g2">
      <div class="card"><div class="card-title">Smallest groups</div>${staBars(sys.groups.smallest, 'size', g => g.name + (g.teacher ? ' · ' + g.teacher : ''), '#d97706')}</div>
      <div class="card"><div class="card-title">Largest groups</div>${staBars(sys.groups.largest, 'size', g => g.name + (g.teacher ? ' · ' + g.teacher : ''), '#16a34a')}</div>
    </div>`) : staSection('Groups & Attendance', '', staNoData('Failed to load: ' + (sys && sys._error)));

  const panels = { overview, students, groups, leads: P.P_LEADS, finance: P.P_FIN, staff: P.P_STAFF, portal: P.P_PORTAL };
  document.getElementById('statContent').innerHTML =
    `<div class="sta-tabs">${STA_TABS.map(([k, l]) => `<button class="sta-tab" data-tab="${k}" onclick="staSetTab('${k}')">${l}</button>`).join('')}</div>` +
    STA_TABS.map(([k]) => `<div class="sta-panel" data-tab="${k}">${panels[k]}</div>`).join('');
  staSetTab(STA_TAB);
  if (piOk || (pi && pi._error)) {
    try { staRenderPortalInsights(pi); }
    catch (e) {
      console.error(e);
      const h = document.getElementById('portalInsights');
      if (h) h.innerHTML = `<div class="card" style="color:#c0392b;font-size:13px">Portal Insights could not be drawn: ${esc(e && e.message || e)}</div>`;
    }
  }
}

/* ── Portal Insights: deeper usage analytics (own endpoint, own container) ── */
function staBars(rows, valKey, labelFn, color, fmt) {
  const max = Math.max(1, ...rows.map(r => r[valKey]));
  return `<div class="sbars">` + (rows.map(r => `<div class="sbar">
    <div class="sbar-top"><span class="sbar-l" title="${esc(labelFn(r))}">${esc(labelFn(r))}</span><span class="sbar-v">${fmt ? fmt(r[valKey]) : staFmt(r[valKey])}</span></div>
    <div class="sbar-track"><div class="sbar-fill" style="width:${Math.max(2, Math.round(r[valKey]/max*100))}%;background:${color}"></div></div></div>`).join('') || '<div class="sta-empty">No data yet</div>') + `</div>`;
}
function staColumns(vals, labels, color, h) {
  const max = Math.max(1, ...vals);
  return `<div class="scols" style="height:${h}px">${vals.map((v,i)=>`<div title="${labels[i]}: ${v}" style="flex:1;min-width:2px;height:${Math.max(v?3:1, Math.round(v/max*h))}px;background:${v?color:'#f3dede'};border-radius:3px 3px 0 0"></div>`).join('')}</div>`;
}
function staAgo(iso) {
  if (!iso) return 'never';
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return d <= 0 ? 'today' : d + 'd ago';
}
function staRenderPortalInsights(d) {
  const host = document.getElementById('portalInsights');
  if (!host) return;
  if (d._error) {
    host.innerHTML = `<div class="card" style="color:#c0392b;font-size:13px">Portal Insights failed to load: ${esc(d._error)}</div>`;
    return;
  }
  const card = (title, body, sub) => `<div class="card"><div class="card-title">${title}</div>${sub?`<div style="font-size:12px;color:var(--muted);margin:-6px 0 10px">${sub}</div>`:''}${body}</div>`;
  const kpi = (l, v, c, sub) => `<div class="card sta-kpi" style="--k:${c}"><div class="sta-kpi-v" style="color:${c}">${v}</div><div class="sta-kpi-l">${l}</div>${sub?`<div class="sta-kpi-s">${sub}</div>`:''}</div>`;
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

  // 30-day activity (fill missing days with 0)
  const byDay = Object.fromEntries(d.daily.map(r => [r.day, r]));
  const days = [], evs = [], stu = [];
  for (let i = 29; i >= 0; i--) {
    const k = new Date(Date.now() - i * 86400000 + 5 * 3600000).toISOString().slice(0, 10);
    days.push(k); evs.push(byDay[k]?.events || 0); stu.push(byDay[k]?.students || 0);
  }
  const hrs = Array.from({length:24}, (_, h) => d.hours.find(r => r.h === h)?.n || 0);
  const peakH = hrs.indexOf(Math.max(...hrs));
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dow = DOW.map((n, i) => ({ n, v: d.supportByDow.find(r => r.dow === i)?.n || 0 }));
  const mix = d.activityMix || {};
  const mixRows = [['Practice tests', mix.practice||0], ['Learning mode words', mix.learn||0], ['Graded exams', mix.exam||0], ['Points earned', mix.points||0]].map(([l, v]) => ({ l, v }));
  const ex = d.exams || {};
  const groups = d.groups.map(g => ({ ...g, adopt: pct(g.accounts, g.members), actv: pct(g.active, g.members) })).sort((a, b) => a.adopt - b.adopt);
  const fb = d.feedback || [];
  const fbUnans = fb.reduce((s, r) => s + r.unanswered, 0);

  const tbl = (head, rows, empty) => staTable(head, rows, empty);
  const empty = '<div class="sta-empty">No data yet</div>';
  const kpis = arr => `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px">${arr.join('')}</div>`;
  const ago = iso => staAgo(iso);
  const SUBS = {
    adoption: `
      ${kpis([
        kpi('Accounts', d.accounts, '#2563eb'),
        kpi('Active 7 days', d.active7, '#16a34a', pct(d.active7, d.accounts) + '% of accounts'),
        kpi('Active 30 days', d.active30, '#0891b2', pct(d.active30, d.accounts) + '% of accounts'),
        kpi('Inactive 30d+', Math.max(0, d.accounts - d.active30), '#d97706', 'have an account, no use'),
      ])}
      <div class="g2" style="margin-bottom:14px">
        ${card('New accounts · last 6 months', staBars(d.accountsByMonth || [], 'n', r => r.month, '#2563eb'))}
        ${card('Adoption by group', `<div class="tscroll"><table class="stbl"><thead><tr><th>Group</th><th>Accounts</th><th>Active 14d</th></tr></thead><tbody>${groups.slice(0, 12).map(g => `<tr><td>${esc(g.name)}<div style="font-size:11px;color:var(--muted)">${esc(g.teacher || '')}</div></td><td>${g.accounts}/${g.members} <b style="color:${g.adopt < 50 ? '#c0392b' : '#16a34a'}">${g.adopt}%</b></td><td>${g.active}/${g.members} <b>${g.actv}%</b></td></tr>`).join('') || '<tr><td colspan="3" style="color:var(--muted);text-align:center">No groups</td></tr>'}</tbody></table></div>`, 'Lowest adoption first — where to push sign-ups')}
      </div>
      ${card('Gone quiet · need a nudge', tbl(['Student', 'Group', 'Last active'], d.dormant.map(r => `<tr><td><a href="student-profile.html?id=${encodeURIComponent(r.id)}">${esc(r.name)}</a></td><td>${esc(r.group || '—')}</td><td>${ago(r.lastAt)}</td></tr>`), 'Everyone is active 🎉'), 'Have an account, no activity for 14+ days')}`,
    engagement: `
      <div class="g2" style="margin-bottom:14px">
        ${card('Daily activity · last 30 days', staColumns(evs, days, '#2563eb', 90) + `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px"><span>${days[0].slice(5)}</span><span>peak ${Math.max(...stu)} students/day</span><span>${days[29].slice(5)}</span></div>`, 'Practice, learning, exams and points events')}
        ${card('When students study', staColumns(hrs, hrs.map((_, h) => h + ':00'), '#c0392b', 90) + `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px"><span>0h</span><span>busiest ${peakH}:00–${peakH+1}:00</span><span>23h</span></div>`, 'Hour of day (Tashkent), last 60 days')}
      </div>
      ${card('What students use (30 days)', staBars(mixRows, 'v', r => r.l, '#7c3aed'))}`,
    learning: `
      ${kpis([
        kpi('Learning mode users', d.learn?.students || 0, '#7c3aed', 'all time'),
        kpi('Words revised', d.learn?.words || 0, '#2563eb', (d.learn?.words30 || 0) + ' in 30 days'),
        kpi('Practice events (30d)', mix.practice || 0, '#16a34a'),
      ])}
      <div class="g2">
        ${card('Most practiced units', staBars(d.units.slice(0, 8), 'attempts', r => r.name, '#2563eb'), '3+ attempts')}
        ${card('Hardest units', staBars([...d.units].sort((a, b) => a.avg_score - b.avg_score).slice(0, 8), 'avg_score', r => r.name, '#d97706', v => v + '%'), 'Lowest average practice score — review in class')}
      </div>
      <div style="margin-top:14px">${card('Most-missed words', d.weakWords.length ? staBars(d.weakWords, 'students', r => r.word + (r.unit_name ? ' · ' + r.unit_name : ''), '#c0392b') : empty, 'Students currently flagging the word as a mistake')}</div>`,
    exams: `
      ${kpis([
        kpi('Graded tests', ex.total || 0, '#2563eb'),
        kpi('Pass rate', ex.total ? pct(ex.passed, ex.total) + '%' : '—', '#16a34a'),
        kpi('Average score', ex.avg_score != null ? ex.avg_score + '%' : '—', '#7c3aed'),
        kpi('Left test early', ex.terminated || 0, '#d97706', 'tab switched / closed'),
      ])}
      <div class="g2">
        ${card('Units with lowest exam pass rate', staBars(d.examsByUnit || [], 'pass_rate', r => r.name, '#c0392b', v => v + '%'), '2+ graded attempts')}
        ${card('Recent graded tests', tbl(['Student', 'Score', 'Result', 'When'], (d.recentExams || []).map(r => `<tr><td><a href="student-profile.html?id=${encodeURIComponent(r.id)}">${esc(r.name)}</a></td><td>${r.score}/${r.total}</td><td style="font-weight:800;color:${r.left ? '#d97706' : r.passed ? '#16a34a' : '#dc2626'}">${r.left ? 'Left early' : r.passed ? 'Passed' : 'Failed'}</td><td>${ago(r.at)}</td></tr>`), 'No graded tests yet'))}
      </div>`,
    support: `
      <div class="g2">
        ${card('Support bookings by teacher', tbl(['Teacher', 'Booked', 'Attended', 'No-show'], d.supportByTeacher.map(r => `<tr><td>${esc(r.teacher || '—')}</td><td>${r.booked}</td><td>${r.attended}</td><td>${r.missed}</td></tr>`), 'No student bookings'), 'Student self-bookings, last 60 days')}
        ${card('Busiest weekdays', staBars(dow, 'v', r => r.n, '#0891b2'), 'All support sessions, last 90 days')}
      </div>`,
    rewards: `
      <div class="g2">
        ${card('Top point earners', staBars(d.topPoints, 'points', r => r.name, '#16a34a'))}
        ${card('Shop purchases', d.shop.map(sh => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0"><span>${esc(sh.item)}</span><b>${sh.n}</b></div>`).join('') || empty)}
      </div>
      <div style="margin-top:14px">${card('Student feedback', (fb.map(r => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>${esc(r.type)}</span><b>${r.n} · ${r.unread} unread · ${r.unanswered} unanswered</b></div>`).join('') || empty) + ((d.fbRecent || []).length ? `<div style="margin-top:12px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Latest</div>` + d.fbRecent.map(r => `<div style="padding:8px 0;border-top:1px solid #fae8e8;font-size:13px"><b>${esc(r.name)}</b> <span style="color:var(--muted)">· ${esc(r.type)} · ${ago(r.at)}${r.replied ? ' · replied' : ''}</span><div style="margin-top:2px">${esc(String(r.message).slice(0, 200))}</div></div>`).join('') : ''))}</div>`,
  };
  const SUB_LABELS = [['adoption', 'Adoption'], ['engagement', 'Engagement'], ['learning', 'Vocabulary'], ['exams', 'Exams'], ['support', 'Support'], ['rewards', 'Points & Feedback']];
  window._staSub = window._staSub || 'adoption';
  window.staPortalSub = k => {
    window._staSub = k;
    document.querySelectorAll('.psub-tab').forEach(b => b.classList.toggle('on', b.dataset.sub === k));
    document.querySelectorAll('.psub').forEach(p => { p.style.display = p.dataset.sub === k ? '' : 'none'; });
  };
  document.getElementById('portalSubTabs').innerHTML = `<div class="sta-tabs sta-subtabs" style="position:static">${SUB_LABELS.map(([k, l]) => `<button class="sta-tab psub-tab" data-sub="${k}" onclick="staPortalSub('${k}')">${l}</button>`).join('')}</div>`;
  host.innerHTML = SUB_LABELS.map(([k]) => `<div class="psub" data-sub="${k}">${SUBS[k]}</div>`).join('');
  window.staPortalSub(window._staSub);
}

staLoad();
setupLive(['students','leads','groups','finance','attendance','vocab'], () => staLoad());
</script>
</body>
