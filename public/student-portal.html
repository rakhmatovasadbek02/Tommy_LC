<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Home — Tommy LC Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="student-shared.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
.sp-next-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.sp-next-item:last-child { border-bottom: none; }
.sp-next-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
.sp-next-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.sp-next-sub { font-size: 12px; color: var(--text-secondary); }
.sp-vstat { margin-bottom: 16px; }
.sp-vstat:last-child { margin-bottom: 0; }
.sp-vstat-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.sp-vstat-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.sp-vstat-sub { font-size: 11.5px; color: var(--text-secondary); }
.sp-vstat-pct { font-size: 15px; font-weight: 700; color: var(--accent); }
.sp-lb-yourank { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; box-shadow: 0 6px 16px -6px rgba(184,28,28,.5); }
.sp-lb-yourank-badge { font-size: 22px; font-weight: 900; line-height: 1; }
.sp-lb-yourank-text { font-size: 12px; font-weight: 600; opacity: .95; }
.sp-lb-yourank-text strong { font-size: 13.5px; display: block; font-weight: 800; }
/* Scrolls like the unit-pick list instead of growing the whole Home page taller for
   every extra group member — a fixed, compact window onto a potentially long roster. */
.sp-lb-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sp-lb-row { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-bottom: 1px solid var(--border); position: relative; transition: background .15s, transform .15s; }
.sp-lb-row:last-child { border-bottom: none; }
.sp-lb-row.self { background: var(--accent-light); box-shadow: inset 0 0 0 1.5px var(--accent); }
.sp-lb-rank { width: 24px; font-size: 13px; font-weight: 800; color: var(--text-secondary); flex-shrink: 0; text-align: center; }
.sp-lb-rank.medal { font-size: 19px; }
.sp-lb-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; color: #fff; background: var(--accent); flex-shrink: 0; letter-spacing: -.3px; }
.sp-lb-avatar.rank-1 { background: linear-gradient(135deg, #FFDE7A, #F0A93A); color: #6b4a00; box-shadow: 0 2px 8px -2px rgba(240,169,58,.7); }
.sp-lb-avatar.rank-2 { background: linear-gradient(135deg, #EDF0F3, #C2C8D0); color: #4b5563; box-shadow: 0 2px 8px -2px rgba(150,160,175,.6); }
.sp-lb-avatar.rank-3 { background: linear-gradient(135deg, #E7AC79, #C17A3D); color: #4a2c0f; box-shadow: 0 2px 8px -2px rgba(193,122,61,.6); }
.sp-lb-info { flex: 1; min-width: 0; }
.sp-lb-name-row { display: flex; align-items: center; gap: 6px; }
.sp-lb-name { font-size: 13.5px; font-weight: 700; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-lb-row.self .sp-lb-name { color: var(--accent-dark); }
.sp-lb-you-tag { font-size: 9.5px; font-weight: 800; color: #fff; background: var(--accent); padding: 1.5px 6px; border-radius: 8px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .3px; }
.sp-lb-sub { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
.sp-lb-score { text-align: right; flex-shrink: 0; }
.sp-lb-pct { font-size: 14.5px; font-weight: 800; color: var(--accent); white-space: nowrap; }
.sp-lb-pct .unit { font-size: 10px; font-weight: 700; color: var(--text-secondary); margin-left: 3px; text-transform: uppercase; }
.sp-lb-empty { text-align: center; padding: 20px 0; }
.sp-lb-empty i { font-size: 26px; color: var(--border); margin-bottom: 8px; display: block; }
.sp-att-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sp-att-chip { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: white; flex-shrink: 0; }
.sp-att-chip.present { background: var(--green); }
.sp-att-chip.absent { background: var(--accent); }
.sp-section-divider { height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>
<div id="spHeader"></div>
<div class="sp-main">
  <div id="content" class="sp-loading">Loading your profile…</div>
</div>
<div id="spTabbar" class="sp-tabbar"></div>
<script src="student-shared.js"></script>
<script>
spRequireAuth();
spRenderHeader('home');

function todayLabel() {
  return new Date().toLocaleDateString('en-GB', { timeZone:'Asia/Tashkent', weekday:'long', day:'numeric', month:'long' });
}
// "Today"/"Tomorrow"/weekday label for a YYYY-MM-DD date, Tashkent-local.
function relativeDayLabel(iso) {
  const now = new Date(new Date().toLocaleString('en-US', { timeZone:'Asia/Tashkent' }));
  const todayISO = now.toISOString().split('T')[0];
  const tmrw = new Date(now); tmrw.setDate(tmrw.getDate()+1);
  const tmrwISO = tmrw.toISOString().split('T')[0];
  if (iso === todayISO) return 'Today';
  if (iso === tmrwISO) return 'Tomorrow';
  return new Date(iso+'T00:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}

async function load() {
  const el = document.getElementById('content');
  try {
    const [me, home, leaderboard] = await Promise.all([
      spGet('/api/student/me'),
      spGet('/api/student/home').catch(() => ({ streak: 0, nextClass: null, nextSupport: null, pendingTest: null, isCefr: false, vocabStats: null, attendance: null, attendanceRecords: [] })),
      spGet('/api/student/leaderboard').catch(() => ({ group: null, rows: [] })),
    ]);
    const nextItems = [];
    if (home.pendingTest) {
      nextItems.push({ icon: 'fa-pen', title: 'Vocabulary test assigned', sub: `${(home.pendingTest.unitNames||[]).join(', ') || 'Ask your teacher for the code'}` });
    }
    if (home.nextClass) {
      nextItems.push({ icon: 'fa-chalkboard-user', title: `Class · ${spEscapeHtml(home.nextClass.groupName)}`, sub: `${relativeDayLabel(home.nextClass.date)} at ${home.nextClass.time}${home.nextClass.room?' · '+spEscapeHtml(home.nextClass.room):''}` });
    }
    if (home.nextSupport) {
      nextItems.push({ icon: 'fa-comments', title: 'One-on-one support', sub: `${relativeDayLabel(home.nextSupport.date)} at ${home.nextSupport.time} · ${spEscapeHtml(home.nextSupport.teacher||'')}` });
    }

    const vs = home.vocabStats;
    const att = home.attendance;
    function initials(name) {
      const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
      return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?';
    }
    const MEDALS = ['🥇','🥈','🥉'];
    // Percent-bar row for a total/passed stat (used for the non-CEFR "Exam Pass" row).
    function vstatRow(title, stat, verb, emptyLabel) {
      verb = verb || 'passed'; emptyLabel = emptyLabel || 'No attempts yet';
      const total = stat?.total || 0, passed = stat?.passed ?? stat?.present ?? 0;
      const pct = total ? Math.round((passed/total)*100) : null;
      return `
        <div class="sp-vstat">
          <div class="sp-vstat-row">
            <span class="sp-vstat-title">${title}</span>
            <span class="sp-vstat-pct">${pct!==null ? pct+'%' : '—'}</span>
          </div>
          <div class="sp-vstat-sub">${total ? `${passed} of ${total} ${verb}` : emptyLabel}</div>
          ${pct!==null ? `<div class="sp-progress-track"><div class="sp-progress-fill ${pct>=80?'green':pct>=50?'amber':''}" style="width:${pct}%"></div></div>` : ''}
        </div>`;
    }

    el.innerHTML = `
      <div class="sp-title">Welcome back, ${spEscapeHtml(me.firstName)}</div>
      <div class="sp-subtitle">${spEscapeHtml(todayLabel())}</div>

      <div class="sp-card">
        <div class="sp-card-title">What's Next</div>
        ${nextItems.length ? nextItems.map(it => `
          <div class="sp-next-item">
            <div class="sp-next-icon"><i class="fas ${it.icon}"></i></div>
            <div>
              <div class="sp-next-title">${it.title}</div>
              <div class="sp-next-sub">${it.sub}</div>
            </div>
          </div>
        `).join('') : `<div class="sp-empty">Nothing scheduled right now.</div>`}
      </div>

      ${(att || vs) ? `
      <div class="sp-card">
        <div class="sp-card-title">Stats</div>

        <div class="sp-vstat">
          <div class="sp-vstat-row">
            <span class="sp-vstat-title">Attendance</span>
            <span class="sp-vstat-pct">${att?.total ? Math.round((att.present/att.total)*100)+'%' : '—'}</span>
          </div>
          ${(home.attendanceRecords||[]).length ? `
            <div class="sp-att-chips">
              ${home.attendanceRecords.map(r => `<div class="sp-att-chip ${r.status}" title="${spEscapeHtml(r.date)}"><i class="fas fa-${r.status==='present'?'check':'xmark'}"></i></div>`).join('')}
            </div>
          ` : `<div class="sp-vstat-sub">No classes recorded yet this month</div>`}
        </div>

        <div class="sp-section-divider"></div>

        ${home.isCefr ? `
          <div class="sp-vstat">
            <div class="sp-vstat-row">
              <span class="sp-vstat-title">Graded Vocab Pass</span>
              <span class="sp-vstat-pct">${vs?.exams?.passed || 0}</span>
            </div>
            <div class="sp-vstat-sub">${vs?.exams?.passed ? `${vs.exams.passed} test${vs.exams.passed===1?'':'s'} passed` : 'No graded tests passed yet'}</div>
          </div>
        ` : vstatRow('Exam Pass', vs?.exams)}
      </div>` : ''}

      ${leaderboard.group && leaderboard.rows.length ? (() => {
        const rows = leaderboard.rows;
        const selfIdx = rows.findIndex(r => r.isSelf);
        return `
      <div class="sp-card sp-lb-card">
        <div class="sp-card-title"><i class="fas fa-trophy" style="color:#F0A93A;margin-right:6px"></i>${spEscapeHtml(leaderboard.group.name)} Leaderboard</div>

        ${selfIdx >= 0 ? `
        <div class="sp-lb-yourank">
          <div class="sp-lb-yourank-badge">${MEDALS[selfIdx] || '#'+(selfIdx+1)}</div>
          <div class="sp-lb-yourank-text">Your rank
            <strong>${selfIdx+1} of ${rows.length}${leaderboard.mode==='points' ? ` · ${rows[selfIdx].points} pts` : ''}</strong>
          </div>
        </div>` : ''}

        <div class="sp-lb-list">
        ${rows.map((r, i) => {
          const rankMarkup = i < 3
            ? `<span class="sp-lb-rank medal">${MEDALS[i]}</span>`
            : `<span class="sp-lb-rank">${i+1}</span>`;
          const avatar = `<div class="sp-lb-avatar${i < 3 ? ' rank-'+(i+1) : ''}">${spEscapeHtml(initials(r.name))}</div>`;
          const scoreHtml = leaderboard.mode === 'points'
            ? `<div class="sp-lb-pct">${r.points}<span class="unit">pts</span></div>`
            : `<div class="sp-lb-pct">${r.total ? r.pct+'%' : '—'}</div><div class="sp-lb-sub">${r.total ? `${r.passed}/${r.total} passed` : 'no attempts'}</div>`;
          return `
          <div class="sp-lb-row${r.isSelf ? ' self' : ''}">
            ${rankMarkup}
            ${avatar}
            <div class="sp-lb-info">
              <div class="sp-lb-name-row">
                <span class="sp-lb-name">${spEscapeHtml(r.name)}</span>
                ${r.isSelf ? '<span class="sp-lb-you-tag">You</span>' : ''}
              </div>
            </div>
            <div class="sp-lb-score">${scoreHtml}</div>
          </div>`;
        }).join('')}
        </div>
      </div>`;
      })() : ''}
    `;
  } catch (e) {
    el.innerHTML = `<div class="sp-banner red">${spEscapeHtml(e.message)}</div>`;
  }
}
load();
spResumeTourIfActive();
spMaybeAutoStartTutorial();
</script>
</body>
</html>
