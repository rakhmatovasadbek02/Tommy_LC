<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Home — Tommy LC Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="student-shared.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
.sp-next-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.sp-next-item:last-child { border-bottom: none; }
.sp-next-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
.sp-next-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.sp-next-sub { font-size: 12px; color: var(--text-secondary); }
.sp-vstat { margin-bottom: 16px; }
.sp-vstat:last-child { margin-bottom: 0; }
.sp-vstat-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.sp-vstat-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.sp-vstat-sub { font-size: 11.5px; color: var(--text-secondary); }
.sp-vstat-pct { font-size: 15px; font-weight: 700; color: var(--accent); }
.sp-lb-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.sp-lb-row:last-child { border-bottom: none; }
.sp-lb-row.self { background: var(--accent-light); margin: 0 -16px; padding: 9px 16px; border-radius: 8px; }
.sp-lb-rank { width: 22px; font-size: 13px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; text-align: center; }
.sp-lb-row.self .sp-lb-rank, .sp-lb-row.self .sp-lb-name { color: var(--accent); }
.sp-lb-name { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-lb-sub { font-size: 11.5px; color: var(--text-secondary); margin-right: 4px; }
.sp-lb-pct { font-size: 14px; font-weight: 700; color: var(--accent); width: 42px; text-align: right; flex-shrink: 0; }
.sp-att-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sp-att-chip { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: white; flex-shrink: 0; }
.sp-att-chip.present { background: var(--green); }
.sp-att-chip.absent { background: var(--accent); }
.sp-section-divider { height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>
<div id="spHeader"></div>
<div class="sp-main">
  <div id="content" class="sp-loading">Loading your profile…</div>
</div>
<div id="spTabbar" class="sp-tabbar"></div>
<script src="student-shared.js"></script>
<script>
spRequireAuth();
spRenderHeader('home');

function todayLabel() {
  return new Date().toLocaleDateString('en-GB', { timeZone:'Asia/Tashkent', weekday:'long', day:'numeric', month:'long' });
}
// "Today"/"Tomorrow"/weekday label for a YYYY-MM-DD date, Tashkent-local.
function relativeDayLabel(iso) {
  const now = new Date(new Date().toLocaleString('en-US', { timeZone:'Asia/Tashkent' }));
  const todayISO = now.toISOString().split('T')[0];
  const tmrw = new Date(now); tmrw.setDate(tmrw.getDate()+1);
  const tmrwISO = tmrw.toISOString().split('T')[0];
  if (iso === todayISO) return 'Today';
  if (iso === tmrwISO) return 'Tomorrow';
  return new Date(iso+'T00:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}

async function load() {
  const el = document.getElementById('content');
  try {
    const [me, home, leaderboard] = await Promise.all([
      spGet('/api/student/me'),
      spGet('/api/student/home').catch(() => ({ streak: 0, nextClass: null, nextSupport: null, pendingTest: null, isCefr: false, vocabStats: null, attendance: null, attendanceRecords: [] })),
      spGet('/api/student/leaderboard').catch(() => ({ group: null, rows: [] })),
    ]);
    const nextItems = [];
    if (home.pendingTest) {
      nextItems.push({ icon: 'fa-pen', title: 'Vocabulary test assigned', sub: `${(home.pendingTest.unitNames||[]).join(', ') || 'Ask your teacher for the code'}` });
    }
    if (home.nextClass) {
      nextItems.push({ icon: 'fa-chalkboard-user', title: `Class · ${spEscapeHtml(home.nextClass.groupName)}`, sub: `${relativeDayLabel(home.nextClass.date)} at ${home.nextClass.time}${home.nextClass.room?' · '+spEscapeHtml(home.nextClass.room):''}` });
    }
    if (home.nextSupport) {
      nextItems.push({ icon: 'fa-comments', title: 'One-on-one support', sub: `${relativeDayLabel(home.nextSupport.date)} at ${home.nextSupport.time} · ${spEscapeHtml(home.nextSupport.teacher||'')}` });
    }

    const vs = home.vocabStats;
    const att = home.attendance;
    // Percent-bar row for a total/passed stat (used for the non-CEFR "Exam Pass" row).
    function vstatRow(title, stat, verb, emptyLabel) {
      verb = verb || 'passed'; emptyLabel = emptyLabel || 'No attempts yet';
      const total = stat?.total || 0, passed = stat?.passed ?? stat?.present ?? 0;
      const pct = total ? Math.round((passed/total)*100) : null;
      return `
        <div class="sp-vstat">
          <div class="sp-vstat-row">
            <span class="sp-vstat-title">${title}</span>
            <span class="sp-vstat-pct">${pct!==null ? pct+'%' : '—'}</span>
          </div>
          <div class="sp-vstat-sub">${total ? `${passed} of ${total} ${verb}` : emptyLabel}</div>
          ${pct!==null ? `<div class="sp-progress-track"><div class="sp-progress-fill ${pct>=80?'green':pct>=50?'amber':''}" style="width:${pct}%"></div></div>` : ''}
        </div>`;
    }

    el.innerHTML = `
      <div class="sp-title">Welcome back, ${spEscapeHtml(me.firstName)}</div>
      <div class="sp-subtitle">${spEscapeHtml(todayLabel())}</div>

      <div class="sp-card">
        <div class="sp-card-title">What's Next</div>
        ${nextItems.length ? nextItems.map(it => `
          <div class="sp-next-item">
            <div class="sp-next-icon"><i class="fas ${it.icon}"></i></div>
            <div>
              <div class="sp-next-title">${it.title}</div>
              <div class="sp-next-sub">${it.sub}</div>
            </div>
          </div>
        `).join('') : `<div class="sp-empty">Nothing scheduled right now.</div>`}
      </div>

      ${(att || vs) ? `
      <div class="sp-card">
        <div class="sp-card-title">Stats</div>

        <div class="sp-vstat">
          <div class="sp-vstat-row">
            <span class="sp-vstat-title">Attendance</span>
            <span class="sp-vstat-pct">${att?.total ? Math.round((att.present/att.total)*100)+'%' : '—'}</span>
          </div>
          ${(home.attendanceRecords||[]).length ? `
            <div class="sp-att-chips">
              ${home.attendanceRecords.map(r => `<div class="sp-att-chip ${r.status}" title="${spEscapeHtml(r.date)}"><i class="fas fa-${r.status==='present'?'check':'xmark'}"></i></div>`).join('')}
            </div>
          ` : `<div class="sp-vstat-sub">No classes recorded yet this month</div>`}
        </div>

        <div class="sp-section-divider"></div>

        ${home.isCefr ? `
          <div class="sp-vstat">
            <div class="sp-vstat-row">
              <span class="sp-vstat-title">Graded Vocab Pass</span>
              <span class="sp-vstat-pct">${vs?.exams?.passed || 0}</span>
            </div>
            <div class="sp-vstat-sub">${vs?.exams?.passed ? `${vs.exams.passed} test${vs.exams.passed===1?'':'s'} passed` : 'No graded tests passed yet'}</div>
          </div>
        ` : vstatRow('Exam Pass', vs?.exams)}
      </div>` : ''}

      ${leaderboard.group && leaderboard.rows.length ? `
      <div class="sp-card">
        <div class="sp-card-title">${spEscapeHtml(leaderboard.group.name)} Leaderboard</div>
        ${leaderboard.rows.map((r, i) => leaderboard.mode === 'points' ? `
          <div class="sp-lb-row${r.isSelf ? ' self' : ''}">
            <div class="sp-lb-rank">${i+1}</div>
            <div class="sp-lb-name">${spEscapeHtml(r.name)}${r.isSelf ? ' (you)' : ''}</div>
            <div class="sp-lb-pct">${r.points} pts</div>
          </div>
        ` : `
          <div class="sp-lb-row${r.isSelf ? ' self' : ''}">
            <div class="sp-lb-rank">${i+1}</div>
            <div class="sp-lb-name">${spEscapeHtml(r.name)}${r.isSelf ? ' (you)' : ''}</div>
            <div class="sp-lb-sub">${r.total ? `${r.passed}/${r.total}` : 'no attempts'}</div>
            <div class="sp-lb-pct">${r.total ? r.pct+'%' : '—'}</div>
          </div>
        `).join('')}
      </div>` : ''}
    `;
  } catch (e) {
    el.innerHTML = `<div class="sp-banner red">${spEscapeHtml(e.message)}</div>`;
  }
}
load();
spResumeTourIfActive();
spMaybeAutoStartTutorial();
</script>
</body>
</html>
