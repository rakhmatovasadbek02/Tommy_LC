<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Register — Tommy LC Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="student-shared.css">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="sp-auth-body">
<div class="sp-auth-page">
<div class="sp-auth-card center">
  <div class="sp-logo-row">
    <img class="sp-logo-mark" src="logo.png" alt="Tommy LC">
    <div class="sp-logo-name">Tommy LC<span>STUDENT PORTAL</span></div>
  </div>
  <div class="sp-auth-h1">Set Up Your Account</div>
  <div class="sp-auth-subtitle">Enter the registration code your admin gave you, then choose a username and password to sign in with.</div>
  <div class="sp-banner red" id="errorMsg" style="display:none"></div>
  <form id="regForm" onsubmit="return doRedeem(event)">
    <div class="sp-form-group" style="text-align:left">
      <label>Registration Code</label>
      <input type="text" class="sp-input sp-code-input" id="code" placeholder="ABCD1234" required maxlength="8" autocomplete="off">
    </div>
    <div class="sp-form-group" style="text-align:left">
      <label>Choose a Username</label>
      <input type="text" class="sp-input" id="username" placeholder="e.g. john.doe" required minlength="3" maxlength="24" autocomplete="username">
    </div>
    <div class="sp-form-group" style="text-align:left">
      <label>Choose a Password</label>
      <input type="password" class="sp-input" id="password" placeholder="At least 4 characters" required minlength="4" autocomplete="new-password">
    </div>
    <button type="submit" class="sp-btn sp-btn-primary sp-btn-block" id="submitBtn">Create Account</button>
  </form>
  <div class="sp-foot-link">Already registered? <a href="student-login.html">Sign in</a></div>
</div>
</div>
<script>
function showError(msg) { const e = document.getElementById('errorMsg'); e.textContent = msg; e.style.display = 'block'; }
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
async function doRedeem(ev) {
  ev.preventDefault();
  hideError();
  const btn = document.getElementById('submitBtn');
  const code = document.getElementById('code').value.trim().toUpperCase();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const r = await fetch('/api/public/student/redeem', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, username, password })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Could not register.');
    localStorage.setItem('lc_student_session', JSON.stringify({ token: data.token, name: data.name }));
    window.location.href = 'student-portal.html';
  } catch (e) {
    showError(e.message);
    btn.disabled = false; btn.textContent = 'Create Account';
  }
  return false;
}
</script>
</body>
</html>
