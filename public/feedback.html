<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback — TommyLC CRM</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#990000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TommyLC">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    .fb-tabs{display:flex;gap:8px;margin-bottom:18px}
    .fb-tab{padding:9px 16px;border-radius:9px;border:1.5px solid var(--border);background:white;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
    .fb-tab.on{border-color:var(--crimson);background:var(--crimson-soft);color:var(--crimson-dark)}
    .fb-item{background:white;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);position:relative}
    .fb-item.unread{border-left:4px solid var(--crimson)}
    .fb-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
    .fb-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .fb-badge.suggestion{background:#E4F8EC;color:#1D8A4C}
    .fb-badge.complaint{background:#FFEAEA;color:#C0202E}
    .fb-student{font-size:13.5px;font-weight:700;color:var(--text)}
    .fb-date{font-size:11.5px;color:var(--muted);white-space:nowrap}
    .fb-message{font-size:13.5px;color:var(--text);line-height:1.6;white-space:pre-wrap;margin-bottom:10px}
    .fb-actions{display:flex;gap:8px}
    .fb-actions button{font-size:11.5px;padding:6px 12px}
    .fb-empty{text-align:center;color:var(--muted);padding:40px;font-size:13.5px}
  </style>
</head>
<body>
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar">
    <div class="page-title">Student Feedback</div>
  </div>
  <div class="page-content">
    <div class="fb-tabs">
      <button class="fb-tab on" id="tabAll" onclick="switchTab('all')">All</button>
      <button class="fb-tab" id="tabUnread" onclick="switchTab('unread')">Unread</button>
      <button class="fb-tab" id="tabSuggestion" onclick="switchTab('suggestion')">Suggestions</button>
      <button class="fb-tab" id="tabComplaint" onclick="switchTab('complaint')">Complaints</button>
    </div>
    <div id="list"><div class="fb-empty">Loading…</div></div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="shared.js"></script>
<script>
requireAuth('feedback');
renderSidebar('feedback');

let ITEMS = [];
let FILTER = 'all';

function switchTab(f) {
  FILTER = f;
  ['all','unread','suggestion','complaint'].forEach(k => document.getElementById('tab'+k[0].toUpperCase()+k.slice(1)).classList.toggle('on', k===f));
  render();
}

async function load() {
  try {
    ITEMS = await apiGet('/api/feedback');
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="fb-empty">${e.message}</div>`;
  }
}

function fmtDate(d) {
  return new Date(d).toLocaleString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
}

function render() {
  const box = document.getElementById('list');
  const rows = ITEMS.filter(it => FILTER === 'all' ? true : FILTER === 'unread' ? !it.read : it.type === FILTER);
  if (!rows.length) { box.innerHTML = `<div class="fb-empty">Nothing here yet.</div>`; return; }
  box.innerHTML = rows.map(it => `
    <div class="fb-item ${it.read ? '' : 'unread'}">
      <div class="fb-item-top">
        <div>
          <span class="fb-badge ${it.type}">${it.type === 'complaint' ? '⚠️ Complaint' : '💡 Suggestion'}</span>
          <div class="fb-student" style="margin-top:6px">${escapeHtml(it.studentName)}</div>
        </div>
        <div class="fb-date">${fmtDate(it.createdAt)}</div>
      </div>
      <div class="fb-message">${escapeHtml(it.message)}</div>
      <div class="fb-actions">
        ${it.read ? '' : `<button class="btn btn-outline" onclick="markRead('${it.id}')">Mark read</button>`}
        <button class="btn btn-outline" onclick="removeItem('${it.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function markRead(id) {
  try { await apiPut(`/api/feedback/${id}/read`, {}); const it = ITEMS.find(x=>x.id===id); if (it) it.read = true; render(); refreshNotifCount(); }
  catch (e) { showToast(e.message, 'error'); }
}

async function removeItem(id) {
  if (!confirm('Delete this message?')) return;
  try { await apiDelete(`/api/feedback/${id}`); ITEMS = ITEMS.filter(x=>x.id!==id); render(); }
  catch (e) { showToast(e.message, 'error'); }
}

load();
setupLive(['feedback'], load);
</script>
</body>
</html>
