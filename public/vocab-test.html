<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Discourage Chrome/Android's built-in "Translate this page" prompt — the word itself
     must stay untranslated for the test to mean anything. -->
<meta name="google" content="notranslate">
<title>Vocabulary Test — Tommy LC Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    /* Same brand tokens as student-shared.css's "Tommy LC Student App" design (Claude
       Design project 1524c168-…): Poppins, crimson #b81c1c, glass cards. */
    --crimson:#b81c1c; --crimson-dark:#8f1515; --crimson-light:#FFD0D0; --crimson-soft:#fff5f5;
    --green:#1E6B45; --green-soft:#D1EAD9; --green-dark:#12592c;
    --border:#e5e7eb; --text:#1a1a1a; --muted:#6b7280; --bg:#fafbfc;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background: var(--bg);
    color:var(--text);
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:28px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  }
  button{font-family:inherit;touch-action:manipulation}
  input{font-family:inherit;touch-action:manipulation}
  .card{
    background:white;border:1px solid var(--border);border-radius:24px;box-shadow:0 4px 12px rgba(0,0,0,.12);
    max-width:560px;width:100%;padding:40px 36px;position:relative;overflow:hidden;z-index:1;
    animation:cardIn .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  @media (min-width:700px){ .card{max-width:640px;padding:48px 52px} }

  /* Identical lockup to .sp-logo-row/.sp-logo-mark/.sp-logo-name in student-shared.css —
     same image size, same two-line name+subtitle block, same colors, on every student page. */
  .logo-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}
  .logo-mark{width:44px;height:44px;border-radius:10px;flex-shrink:0;object-fit:contain}
  .logo{font-size:21px;font-weight:700;color:var(--crimson);text-align:left;line-height:1.1}
  .logo span{display:block;font-size:9.5px;font-weight:600;letter-spacing:1.5px;color:var(--muted);margin-top:2px;text-transform:uppercase}
  h1{font-size:21px;margin:0 0 8px;text-align:center;font-weight:800}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

  input[type=text]{
    width:100%;padding:18px 16px;border:2px solid var(--border);border-radius:14px;
    font-size:22px;font-weight:700;margin-bottom:16px;letter-spacing:2px;text-align:center;
    transition:border-color .15s,box-shadow .15s;color:var(--text);background:#fff;
  }
  input[type=text]:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 4px var(--crimson-soft)}
  input[type=text]::placeholder{letter-spacing:0;font-weight:500;color:#c9beba}
  #qAnswer{text-align:left;letter-spacing:normal;font-size:20px}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:18px;
    border-radius:14px;border:none;background:var(--crimson);color:white;font-size:16px;font-weight:800;
    cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s;
    box-shadow:0 6px 18px rgba(184,28,28,.25);min-height:58px;
  }
  .btn:hover{background:var(--crimson-dark)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
  .btn-outline{background:white;color:var(--crimson-dark);border:2px solid var(--border);box-shadow:none}
  .btn-outline:hover{border-color:var(--crimson);background:var(--crimson-soft)}
  .btn-ghost{background:transparent;color:var(--muted);box-shadow:none;font-weight:700}
  .btn-ghost:hover{background:var(--bg);color:var(--text)}

  .err{
    color:var(--crimson-dark);background:var(--crimson-soft);border:1.5px solid #f3c9c9;border-radius:12px;
    padding:12px 14px;font-size:13.5px;margin-bottom:16px;display:none;font-weight:600;
    animation:shake .3s;
  }
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .hide{display:none !important}

  .meta{background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:16px 18px;font-size:14px;color:var(--muted);margin-bottom:22px;line-height:1.7}
  .meta b{color:var(--text);font-size:15px}

  .progress-bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:28px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--crimson-light),var(--crimson));border-radius:99px;transition:width .35s cubic-bezier(.3,.8,.3,1)}

  .qcounter{text-align:center;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:10px}
  .qtimer{text-align:center;font-size:14px;font-weight:800;color:var(--muted);margin-bottom:6px;transition:color .2s}
  .qtimer.low{color:var(--crimson-dark);animation:shake .3s}
  /* Selecting the word lets a student trigger the browser/OS's built-in "Translate"/"Ask AI"
     popup on long-press or right-click — disabling selection on the prompt removes that path. */
  .qprompt{font-size:36px;font-weight:800;text-align:center;margin:4px 0 30px;line-height:1.25;word-break:break-word;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  @media (min-width:700px){ .qprompt{font-size:42px} }

  #questionBody{animation:qIn .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes qIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

  .mc-options{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px}
  @media (min-width:560px){ .mc-options{grid-template-columns:1fr 1fr} }
  .mc-option{
    width:100%;text-align:center;padding:20px 16px;border:2px solid var(--border);border-radius:14px;
    font-size:17px;font-weight:700;background:white;cursor:pointer;color:var(--text);min-height:64px;
    transition:transform .08s,border-color .15s,background .15s,box-shadow .15s;
    display:flex;align-items:center;justify-content:center;
  }
  .mc-option:active{transform:scale(.96)}
  .mc-option:hover{border-color:var(--crimson-light)}
  .mc-option.selected{border-color:var(--crimson);background:var(--crimson-soft);color:var(--crimson-dark);box-shadow:0 0 0 4px var(--crimson-soft)}

  /* ── Result ── */
  .result-hero{display:flex;flex-direction:column;align-items:center;margin-bottom:10px;position:relative}
  .result-glow{
    position:absolute;top:-10px;width:150px;height:150px;border-radius:50%;
    filter:blur(6px);opacity:0;z-index:0;
  }
  .result-glow.pass{background:radial-gradient(circle,rgba(26,122,60,.22) 0%,transparent 70%);animation:glowPulse 2.2s ease-in-out infinite}
  .result-glow.fail{background:radial-gradient(circle,rgba(184,28,28,.14) 0%,transparent 70%)}
  @keyframes glowPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  .result-badge{
    width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;animation:badgeIn .5s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:1;
  }
  .result-badge svg{width:52px;height:52px}
  @keyframes badgeIn{from{opacity:0;transform:scale(.4) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  .result-badge.pass{background:linear-gradient(155deg,#22a355,var(--green));color:white;box-shadow:0 10px 28px rgba(26,122,60,.35)}
  .result-badge.fail{background:linear-gradient(155deg,var(--crimson-light),var(--crimson-dark));color:white;box-shadow:0 10px 28px rgba(184,28,28,.3)}
  .result-title{font-size:30px;font-weight:800;text-align:center;margin-bottom:6px;letter-spacing:-.3px}
  .result-title.pass{color:var(--green-dark)}
  .result-title.fail{color:var(--crimson-dark)}
  .result-subtitle{font-size:14.5px;text-align:center;color:var(--muted);font-weight:600;margin-bottom:18px;max-width:340px;line-height:1.5}
  .result-score{
    font-size:15px;text-align:center;color:var(--muted);margin-bottom:24px;font-weight:700;
    background:var(--bg);border:1.5px solid var(--border);border-radius:99px;padding:8px 20px;display:inline-block;
    align-self:center;
  }
  .result-score b{color:var(--text);font-size:19px}

  .rlist{max-height:280px;overflow:auto;margin-bottom:22px;border-radius:12px;border:1.5px solid var(--border)}
  .ritem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px}
  .ritem:last-child{border-bottom:none}
  .ritem .rq{color:var(--muted);font-weight:600}
  .ritem .ra{display:flex;align-items:center;gap:6px;font-weight:700}
  .ritem.ok .ra{color:var(--green)}
  .ritem.bad .ra{color:var(--crimson-dark)}
  .ritem .rexp{color:var(--muted);font-weight:500}
  .ritem-icon{width:18px;height:18px;flex-shrink:0}

  .hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:4px}
</style>
</head>
<body>
<div class="card" id="card">

  <div id="viewEntry">
    <div class="logo-row"><img class="logo-mark" src="logo.png" alt="Tommy LC"><div class="logo">Tommy LC<span>Student Portal</span></div></div>
    <h1>Enter your code</h1>
    <div class="err" id="entryErr"></div>
    <label>Access code</label>
    <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="• • • • • •" autofocus>
    <button class="btn" onclick="startFromCode()">Continue</button>
  </div>

  <div id="viewConfirm" class="hide">
    <div class="logo-row"><img class="logo-mark" src="logo.png" alt="Tommy LC"><div class="logo">Tommy LC<span>Student Portal</span></div></div>
    <h1 id="confirmName"></h1>
    <div class="meta" id="confirmMeta"></div>
    <button class="btn" onclick="beginTest()">Start Test</button>
  </div>

  <div id="viewTest" class="hide">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div id="questionBody">
      <div class="qcounter" id="qCounter"></div>
      <div class="qtimer" id="qTimer"></div>
      <div class="qprompt" id="qPrompt"></div>
      <input type="text" id="qAnswer" placeholder="Type in English…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')nextQuestion()">
      <div class="mc-options hide" id="mcOptions"></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" style="flex:0 0 auto;width:auto;padding-left:22px;padding-right:22px" onclick="skipQuestion()">Skip</button>
      <button class="btn" style="flex:1" onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <div id="viewResult" class="hide">
    <div class="result-hero">
      <div class="result-glow" id="resultGlow"></div>
      <div class="result-badge" id="resultBadge"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-subtitle" id="resultSubtitle"></div>
      <div class="result-score" id="resultScore"></div>
    </div>
    <div class="rlist" id="resultList"></div>
    <button class="btn" onclick="resetToStart()">Finish</button>
    <div class="hint">Ask your admin for a new code for your next test.</div>
  </div>

</div>
<script>
let ACCESS_ID = null;
let QUESTIONS = [];
let IDX = 0;
let ANSWERS = [];
let SELECTED_MC = null;

// ── Per-word timer ──
// Each word gets 15s, but time isn't reset per word — whatever's left when the student
// moves on (by answering or skipping) rolls into the next word's allowance, so unused
// time from easy words banks up for harder ones later. A single running "bank" number
// models this: it only ever grows by +15 at each transition, never resets to a flat 15.
const TIME_PER_WORD = 15;
let TIMER_BANK = TIME_PER_WORD;
let TIMER_INTERVAL = null;
// The bank counts down against a wall-clock deadline rather than "one tick = one second
// gone" — a backgrounded tab has its setInterval throttled (or paused) by the browser, so
// counting ticks lets a student bank extra real time just by switching away and back.
// Deriving the remaining time from Date.now() instead means switching tabs can never add
// time: whatever real seconds actually passed are always what get deducted.
let TIMER_DEADLINE = null;

function startTimer() {
  stopTimer();
  TIMER_DEADLINE = Date.now() + TIMER_BANK * 1000;
  tickTimer();
  TIMER_INTERVAL = setInterval(tickTimer, 250);
}
function tickTimer() {
  TIMER_BANK = Math.max(0, Math.ceil((TIMER_DEADLINE - Date.now()) / 1000));
  renderTimer();
  if (TIMER_BANK <= 0) { stopTimer(); handleTimeout(); }
}
function stopTimer() {
  if (TIMER_INTERVAL) { clearInterval(TIMER_INTERVAL); TIMER_INTERVAL = null; }
  // Settle the bank to the real elapsed time before it's read (e.g. by leaveWord) —
  // otherwise a word answered right after the tab regains visibility would still show
  // however many seconds were left at the last tick, not what's actually left now.
  if (TIMER_DEADLINE != null) { TIMER_BANK = Math.max(0, Math.ceil((TIMER_DEADLINE - Date.now()) / 1000)); TIMER_DEADLINE = null; }
}
function renderTimer() {
  const el = document.getElementById('qTimer');
  if (!el) return;
  el.textContent = TIMER_BANK + 's';
  el.classList.toggle('low', TIMER_BANK <= 5);
}
// Whatever's left on the clock when leaving a word carries into the next word, plus a
// fresh +15s — but only the FIRST time a given word is left. Each word gets exactly one
// +15s allowance to grant, no matter how it's left (answered, skipped, or timed out);
// without that guard, skipping the same word every time it cycles back around would
// re-grant +15s forever, letting a student stockpile unlimited time.
const ROLLED_QIDS = new Set();
function leaveWord(qid) {
  stopTimer();
  if (!ROLLED_QIDS.has(qid)) { TIMER_BANK += TIME_PER_WORD; ROLLED_QIDS.add(qid); }
}
function handleTimeout() {
  if (IDX >= QUESTIONS.length) return;
  const q = QUESTIONS[IDX];
  ANSWERS.push({ qid: q.qid, given: '' });
  leaveWord(q.qid);
  IDX++;
  if (IDX < QUESTIONS.length) { renderQuestion(); return; }
  document.getElementById('progressFill').style.width = '100%';
  submitTest();
}

// ── Anti-cheat guard ──
// Switching tabs, minimizing, or closing the page while a test is in progress reports a
// violation the instant it happens (visibilitychange fires before the page actually
// unloads, so this also catches an outright close) — the server auto-fails the attempt
// and burns the code, so there is no way to switch away/look something up and come back.
let TEST_ACTIVE = false;
let VIOLATION_SENT = false;

function reportViolation(reason) {
  if (!TEST_ACTIVE || VIOLATION_SENT) return;
  VIOLATION_SENT = true;
  TEST_ACTIVE = false;
  stopTimer();
  try {
    fetch('/api/public/vocab/test/' + ACCESS_ID + '/violation', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason }), keepalive: true
    }).catch(() => {});
  } catch (e) {}
  showTerminated();
}

function showTerminated() {
  const glow = document.getElementById('resultGlow');
  const badge = document.getElementById('resultBadge');
  const title = document.getElementById('resultTitle');
  glow.className = 'result-glow fail';
  badge.className = 'result-badge fail';
  badge.innerHTML = IC_X;
  title.className = 'result-title fail';
  title.textContent = 'Test Terminated';
  document.getElementById('resultSubtitle').textContent =
    'You left the test, so this attempt was recorded as failed. Ask your admin for a new code.';
  document.getElementById('resultScore').style.display = 'none';
  document.getElementById('resultList').innerHTML = '';
  show('viewResult');
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') reportViolation('left_page');
});
window.addEventListener('pagehide', () => reportViolation('left_page'));
window.addEventListener('beforeunload', (e) => {
  if (TEST_ACTIVE) { e.preventDefault(); e.returnValue = ''; }
});

const IC_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const IC_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

function show(id) {
  ['viewEntry','viewConfirm','viewTest','viewResult'].forEach(v => document.getElementById(v).classList.toggle('hide', v !== id));
}

function resetToStart() {
  ACCESS_ID = null; QUESTIONS = []; IDX = 0; ANSWERS = []; SELECTED_MC = null;
  TEST_ACTIVE = false; VIOLATION_SENT = false;
  stopTimer(); TIMER_BANK = TIME_PER_WORD; ROLLED_QIDS.clear();
  const codeInput = document.getElementById('codeInput');
  codeInput.value = '';
  document.getElementById('entryErr').style.display = 'none';
  show('viewEntry');
  setTimeout(() => codeInput.focus(), 50);
}

async function startFromCode() {
  const code = document.getElementById('codeInput').value.trim();
  const errEl = document.getElementById('entryErr');
  errEl.style.display = 'none';
  if (!code) return;
  try {
    const r = await fetch('/api/public/vocab/access/' + encodeURIComponent(code));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Invalid code.');
    ACCESS_ID = data.accessId;
    document.getElementById('confirmName').textContent = 'Hi, ' + data.studentName + '!';
    document.getElementById('confirmMeta').innerHTML = `<b>${escapeHtml(data.unitNames.join(', '))}</b><br>${data.wordCount} words`;
    show('viewConfirm');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function beginTest() {
  const r = await fetch('/api/public/vocab/test/' + ACCESS_ID);
  const data = await r.json();
  if (!r.ok) { alert(data.error || 'Could not start test.'); show('viewEntry'); return; }
  QUESTIONS = data.questions;
  IDX = 0;
  ANSWERS = [];
  TEST_ACTIVE = true;
  VIOLATION_SENT = false;
  TIMER_BANK = TIME_PER_WORD;
  ROLLED_QIDS.clear();
  show('viewTest');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[IDX];
  SELECTED_MC = null;
  // Re-trigger the entrance animation on every question.
  const body = document.getElementById('questionBody');
  body.style.animation = 'none';
  void body.offsetWidth;
  body.style.animation = '';

  document.getElementById('qCounter').textContent = `Question ${IDX + 1} of ${QUESTIONS.length}`;
  document.getElementById('qPrompt').textContent = q.prompt;
  document.getElementById('progressFill').style.width = (IDX / QUESTIONS.length * 100) + '%';
  const input = document.getElementById('qAnswer');
  const mcBox = document.getElementById('mcOptions');
  if (q.options) {
    input.classList.add('hide');
    mcBox.classList.remove('hide');
    mcBox.innerHTML = q.options.map((o, i) => `<button type="button" class="mc-option" onclick="selectMc(this, ${i})">${escapeHtml(o)}</button>`).join('');
  } else {
    mcBox.classList.add('hide');
    input.classList.remove('hide');
    input.value = '';
    input.focus();
  }
  startTimer();
}

function selectMc(btn, i) {
  SELECTED_MC = QUESTIONS[IDX].options[i];
  document.querySelectorAll('#mcOptions .mc-option').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

// Sends the current word to the back of the queue instead of answering it — the word
// isn't removed or scored, it just comes back around later (each question keeps its own
// qid, so this reordering never affects how answers are matched up when scoring).
function skipQuestion() {
  const [q] = QUESTIONS.splice(IDX, 1);
  QUESTIONS.push(q);
  leaveWord(q.qid);
  renderQuestion();
}

async function nextQuestion() {
  if (IDX >= QUESTIONS.length) return; // guard against a stray double-submit
  const q = QUESTIONS[IDX];
  const given = q.options ? (SELECTED_MC || '') : document.getElementById('qAnswer').value.trim();
  if (q.options && !given) return; // must pick an option first
  ANSWERS.push({ qid: q.qid, given });
  leaveWord(q.qid);
  IDX++;
  if (IDX < QUESTIONS.length) { renderQuestion(); return; }
  document.getElementById('progressFill').style.width = '100%';
  await submitTest();
}

async function submitTest() {
  TEST_ACTIVE = false; // a normal finish shouldn't be caught by the anti-cheat guard
  stopTimer();
  const r = await fetch('/api/public/vocab/test/' + ACCESS_ID + '/submit', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ answers: ANSWERS })
  });
  const data = await r.json();
  if (!r.ok) { alert(data.error || 'Could not submit test.'); return; }

  document.getElementById('resultScore').style.display = '';
  const state = data.passed ? 'pass' : 'fail';
  const glow = document.getElementById('resultGlow');
  const badge = document.getElementById('resultBadge');
  const title = document.getElementById('resultTitle');
  glow.className = 'result-glow ' + state;
  badge.className = 'result-badge ' + state;
  badge.innerHTML = data.passed ? IC_CHECK : IC_X;
  title.className = 'result-title ' + state;
  title.textContent = data.passed ? 'Passed!' : 'Not Passed';
  document.getElementById('resultSubtitle').textContent = data.passed
    ? 'Nice work — you know this vocabulary well.'
    : 'Keep practicing this unit and try again with a new code.';
  document.getElementById('resultScore').innerHTML = `<b>${data.score} / ${data.total}</b> correct`;
  document.getElementById('resultList').innerHTML = data.details.map(d => `
    <div class="ritem ${d.correct ? 'ok' : 'bad'}">
      <span class="rq">${escapeHtml(d.prompt)}</span>
      <span class="ra">
        <svg class="ritem-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${d.correct ? '<polyline points="20 6 9 17 4 12"/>' : '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'}</svg>
        ${escapeHtml(d.given || '—')}${d.correct ? '' : ` <span class="rexp">(→ ${escapeHtml(d.expected)})</span>`}
      </span>
    </div>
  `).join('');
  show('viewResult');
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') startFromCode(); });
</script>
</body>
</html>
