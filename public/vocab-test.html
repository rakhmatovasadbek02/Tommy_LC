<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Vocabulary Test — TommyLC</title>
<style>
  :root{ color-scheme: light only; --crimson:#990000; --crimson-dark:#700000; --crimson-soft:#fbe9e9; --border:#e6e2e0; --text:#20181a; --muted:#8a7f7d; --bg:#faf7f6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.08);max-width:480px;width:100%;padding:32px 28px}
  .logo{font-weight:800;font-size:20px;color:var(--crimson-dark);text-align:center;margin-bottom:4px}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  h1{font-size:19px;margin:0 0 6px;text-align:center}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  input[type=text]{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:14px}
  input[type=text]:focus{outline:none;border-color:var(--crimson)}
  .btn{display:block;width:100%;padding:14px;border-radius:10px;border:none;background:var(--crimson);color:white;font-size:15px;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--crimson-dark)}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:var(--crimson-dark);background:var(--crimson-soft);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
  .hide{display:none !important}
  .meta{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
  .meta b{color:var(--text)}
  .progress-bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:22px}
  .progress-fill{height:100%;background:var(--crimson);transition:width .2s}
  .qprompt{font-size:26px;font-weight:800;text-align:center;margin:6px 0 22px}
  .qdir{text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .result-score{font-size:44px;font-weight:800;text-align:center;color:var(--crimson-dark);margin:10px 0 4px}
  .result-label{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
  .rlist{max-height:320px;overflow:auto;margin-bottom:18px}
  .ritem{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .ritem .rq{color:var(--muted)}
  .ritem.ok .ra{color:#1a7a3c;font-weight:700}
  .ritem.bad .ra{color:var(--crimson-dark);font-weight:700}
</style>
</head>
<body>
<div class="card">

  <div id="viewEntry">
    <div class="logo">TommyLC</div>
    <div class="sub">Vocabulary Test</div>
    <h1>Enter your code</h1>
    <div class="err" id="entryErr"></div>
    <label>Access code</label>
    <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="6-digit code" autofocus>
    <button class="btn" onclick="startFromCode()">Continue</button>
  </div>

  <div id="viewConfirm" class="hide">
    <div class="logo">TommyLC</div>
    <div class="sub">Vocabulary Test</div>
    <h1 id="confirmName"></h1>
    <div class="meta" id="confirmMeta"></div>
    <button class="btn" onclick="beginTest()">Start Test</button>
  </div>

  <div id="viewTest" class="hide">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="qdir" id="qCounter"></div>
    <div class="qprompt" id="qPrompt"></div>
    <input type="text" id="qAnswer" placeholder="Type the translation…" autocomplete="off" onkeydown="if(event.key==='Enter')nextQuestion()">
    <button class="btn" onclick="nextQuestion()">Next</button>
  </div>

  <div id="viewResult" class="hide">
    <div class="logo">TommyLC</div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-label">correct answers</div>
    <div class="rlist" id="resultList"></div>
    <div style="text-align:center;color:var(--muted);font-size:12.5px">Ask your admin for a new code for your next test.</div>
  </div>

</div>
<script>
let ACCESS_ID = null;
let QUESTIONS = [];
let IDX = 0;
let ANSWERS = [];

function show(id) {
  ['viewEntry','viewConfirm','viewTest','viewResult'].forEach(v => document.getElementById(v).classList.toggle('hide', v !== id));
}

async function startFromCode() {
  const code = document.getElementById('codeInput').value.trim();
  const errEl = document.getElementById('entryErr');
  errEl.style.display = 'none';
  if (!code) return;
  try {
    const r = await fetch('/api/public/vocab/access/' + encodeURIComponent(code));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Invalid code.');
    ACCESS_ID = data.accessId;
    document.getElementById('confirmName').textContent = 'Hi, ' + data.studentName + '!';
    const pairLabel = data.languagePair === 'RU-ENG' ? 'Russian ↔ English' : 'English ↔ Uzbek';
    document.getElementById('confirmMeta').innerHTML = `<b>${escapeHtml(data.unitNames.join(', '))}</b><br>${data.wordCount} words · ${pairLabel}`;
    show('viewConfirm');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function beginTest() {
  const r = await fetch('/api/public/vocab/test/' + ACCESS_ID);
  const data = await r.json();
  if (!r.ok) { alert(data.error || 'Could not start test.'); show('viewEntry'); return; }
  QUESTIONS = data.questions;
  IDX = 0;
  ANSWERS = [];
  show('viewTest');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[IDX];
  document.getElementById('qCounter').textContent = `Question ${IDX + 1} of ${QUESTIONS.length}`;
  document.getElementById('qPrompt').textContent = q.prompt;
  document.getElementById('progressFill').style.width = (IDX / QUESTIONS.length * 100) + '%';
  const input = document.getElementById('qAnswer');
  input.value = '';
  input.focus();
}

async function nextQuestion() {
  if (IDX >= QUESTIONS.length) return; // guard against a stray double-submit
  const given = document.getElementById('qAnswer').value.trim();
  ANSWERS.push({ qid: QUESTIONS[IDX].qid, given });
  IDX++;
  if (IDX < QUESTIONS.length) { renderQuestion(); return; }
  document.getElementById('progressFill').style.width = '100%';
  await submitTest();
}

async function submitTest() {
  const r = await fetch('/api/public/vocab/test/' + ACCESS_ID + '/submit', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ answers: ANSWERS })
  });
  const data = await r.json();
  if (!r.ok) { alert(data.error || 'Could not submit test.'); return; }
  document.getElementById('resultScore').textContent = `${data.score} / ${data.total}`;
  document.getElementById('resultList').innerHTML = data.details.map(d => `
    <div class="ritem ${d.correct ? 'ok' : 'bad'}">
      <span class="rq">${escapeHtml(d.prompt)}</span>
      <span class="ra">${escapeHtml(d.given || '—')}${d.correct ? '' : ' (→ ' + escapeHtml(d.expected) + ')'}</span>
    </div>
  `).join('');
  show('viewResult');
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') startFromCode(); });
</script>
</body>
</html>
